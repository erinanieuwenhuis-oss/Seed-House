<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#3d4f3d"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="glōw"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <link rel="icon" type="image/png" href="icons/icon-192.png"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <title>glōw — skin ritual tracker</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body,#root{height:100%;width:100%;overflow:hidden;background:#2e3f2e}
    body{font-family:"Palatino Linotype",Palatino,Georgia,serif;overscroll-behavior:none}
    #root{display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
    #splash{position:fixed;inset:0;background:linear-gradient(160deg,#3d4f3d,#2e3f2e);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.6s ease}
    #splash.hide{opacity:0;pointer-events:none}
    #splash-title{font-size:52px;font-weight:700;font-style:italic;color:#e8f0de;letter-spacing:0.12em;margin-top:16px}
    #splash-sub{font-size:12px;color:#8aaa7a;letter-spacing:0.3em;text-transform:uppercase;margin-top:8px}
    #splash-loader{width:40px;height:3px;background:#3d5c3a;border-radius:2px;margin-top:32px;overflow:hidden}
    #splash-loader::after{content:"";display:block;height:100%;background:#7a9e7e;border-radius:2px;animation:load 1.4s ease forwards}
    @keyframes load{from{width:0}to{width:100%}}
    .app-wrap{width:100%;max-width:430px;height:100vh;overflow:hidden;display:flex;flex-direction:column;background:#f5f0e8;box-shadow:0 0 60px rgba(0,0,0,0.2)}
    .scroll-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom,0px)}
    button{-webkit-appearance:none;appearance:none}
    input,textarea,select{-webkit-appearance:none;appearance:none;font-size:16px!important}
    @media (display-mode:standalone){body{padding-top:env(safe-area-inset-top,0px)}}
  </style>
</head>
<body>

<!-- Splash screen -->
<div id="splash">
  <svg width="96" height="96" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bg2" cx="50%" cy="38%" r="60%"><stop offset="0%" stop-color="#5a7a52"/><stop offset="100%" stop-color="#2e3f2e"/></radialGradient>
      <radialGradient id="lf2" cx="40%" cy="30%" r="60%"><stop offset="0%" stop-color="#a8c89a"/><stop offset="100%" stop-color="#6a9460"/></radialGradient>
      <clipPath id="cc"><rect width="1024" height="1024" rx="220"/></clipPath>
    </defs>
    <rect width="1024" height="1024" rx="220" fill="url(#bg2)"/>
    <ellipse cx="512" cy="360" rx="370" ry="350" fill="#3d5c3a" opacity="0.45" clip-path="url(#cc)"/>
    <path d="M512 200 C650 255,755 385,722 510 C700 590,635 645,560 660 C536 665,490 665,466 657 C388 628,308 548,308 456 C308 316,398 212,512 200 Z" fill="url(#lf2)" clip-path="url(#cc)"/>
    <path d="M512 228 C502 400,480 540,466 657" fill="none" stroke="#c8e8b8" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
    <path d="M512 540 C512 540,440 616,440 650 C440 694,472 720,512 720 C552 720,584 694,584 650 C584 616,512 540,512 540 Z" fill="#f5f0e6" opacity="0.93" clip-path="url(#cc)"/>
  </svg>
  <div id="splash-title">glōw</div>
  <div id="splash-sub">skin ritual tracker</div>
  <div id="splash-loader"></div>
</div>

<div id="root"></div>

<!-- React + Babel via CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

// ─── Constants ────────────────────────────────────────────────
const SKIN_CONDITIONS = ["✨ Clear","🌿 Calm","🔴 Breakout","💧 Dry","🫧 Oily","🌸 Sensitive","😴 Tired"];
const MOODS = ["😊 Happy","😌 Calm","😤 Stressed","😴 Tired","🥰 Glowing"];
const DEFAULT_MORNING = ["Cleanser","Toner","Serum","Moisturizer","SPF"];
const DEFAULT_EVENING = ["Makeup Remover","Cleanser","Toner","Treatment","Night Cream"];
const DEFAULT_BODY_PRODUCTS = ["Body Wash","Lotion","Body Butter"];
const DEFAULT_HAIR_PRODUCTS = ["Shampoo","Conditioner","Hair Oil"];
const HAIRCUT_FREQUENCIES = [3,4,5,6,7,8,10,12];
const TREATMENT_CATEGORIES = ["Face","Eyes","Lips","Body","Hair","Nails","Other"];
const TREATMENT_FREQUENCIES = ["Weekly","Bi-weekly","Monthly","Every 6 weeks","Every 3 months","As needed"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS_SHORT = ["Su","Mo","Tu","We","Th","Fr","Sa"];
const PHOTO_TAGS = ["AM","PM","Progress","Reaction","Glow","Concern"];

// Colour used for product notes so they stand out as reminders in the daily checklist
const NOTE_COLOR = "#7b4fa0";

// Body area / category selector (facial skin, body skin, hair)
const CATEGORIES = [
  { id: "facial", icon: "🧖‍♀️", label: "Facial Skin" },
  { id: "body",   icon: "🧴",   label: "Body Skin" },
  { id: "hair",   icon: "💇‍♀️", label: "Hair" },
  { id: "tiktok", icon: "🎬",   label: "TikTok Try" },
];

// TikTok Try
const TRIAL_LENGTHS = [7, 14, 21, 30];
const TRIAL_IMPRESSIONS = ["😍 Better", "😐 No change", "😣 Worse"];
const TRIAL_VERDICTS = {
  worked: { label: "It worked", icon: "✅", color: "#5f8a63" },
  show:   { label: "Just for show", icon: "🎭", color: "#c4604a" },
};

// UV protection recommendations
const UV_LEVELS = [
  { max: 2,  label: "Low",       color: "#7a9e7e", emoji: "🟢", rec: "SPF 15 or higher — light protection needed today.", detail: "Enjoy the day! Minimal UV risk, but a light SPF is still good practice." },
  { max: 5,  label: "Moderate",  color: "#c4a86a", emoji: "🟡", rec: "SPF 30 recommended — seek shade midday.", detail: "Apply SPF 30, wear a hat if outdoors for extended periods. Reapply every 2 hours." },
  { max: 7,  label: "High",      color: "#d4946a", emoji: "🟠", rec: "SPF 50 recommended — reduce midday exposure.", detail: "Limit time in direct sun between 10am–4pm. Reapply SPF every 90 mins. Cover up." },
  { max: 10, label: "Very High", color: "#c4604a", emoji: "🔴", rec: "SPF 50+ essential — take extra precautions.", detail: "Avoid sun exposure 10am–4pm if possible. Wear SPF 50+, hat, and protective clothing." },
  { max: 99, label: "Extreme",   color: "#8a3a6a", emoji: "🟣", rec: "SPF 50+ required — avoid outdoor exposure.", detail: "Stay indoors where possible. If outside: SPF 50+, full coverage clothing, and shade at all times." },
];
const getUVLevel = (uv) => UV_LEVELS.find(l => uv <= l.max) || UV_LEVELS[UV_LEVELS.length - 1];

// ─── Helpers ──────────────────────────────────────────────────
const todayStr = () => new Date().toISOString().split("T")[0];
const fmtDate = (d) => {
  const o = new Date(d + "T12:00:00");
  return { day: ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][o.getDay()], short: DAYS_SHORT[o.getDay()], date: o.getDate(), month: MONTHS[o.getMonth()], year: o.getFullYear() };
};
const addDaysStr = (d, n) => { const o = new Date(d + "T12:00:00"); o.setDate(o.getDate() + n); return o.toISOString().split("T")[0]; };
const daysBetween = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 86400000);
const shortDate = (d) => { const f = fmtDate(d); return `${f.month.slice(0, 3)} ${f.date}`; };
// Progress of a running TikTok Try trial. endDate is the last day of the period; reflection is due from that day.
const trialProgress = (t, today) => {
  const dates = Array.from({ length: t.days || 0 }, (_, i) => addDaysStr(t.startDate, i));
  const started = today >= t.startDate;
  const elapsed = started ? Math.min(t.days, daysBetween(t.startDate, today) + 1) : 0;
  const checked = dates.filter(d => t.checkins?.[d]).length;
  return { dates, started, elapsed, checked, due: today >= t.endDate };
};
const getDaysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
const getFirstDay = (y, m) => new Date(y, m, 1).getDay();
const ls = {
  get: (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

// ─── Product Tracker Logic ────────────────────────────────────
// productData[name] = {
//   calibrating: bool, calibrationStart: dateStr, calibrationUses: number, calibrationDays: number,
//   learnedDuration: number (days), learnedUsesPerDay: number,
//   stock: [{ restockedAt: dateStr, estimatedEmpty: dateStr, usesLogged: number, notified: bool }],
//   history: [{ date, period }]
// }
const initProductData = () => ({
  calibrating: true,
  calibrationStart: todayStr(),
  calibrationUses: 0,
  calibrationDays: 30,
  learnedDuration: null,
  learnedUsesPerDay: null,
  stock: [{ restockedAt: todayStr(), estimatedEmpty: null, usesLogged: 0, notified: false }],
  history: []
});

const logProductUse = (pd, date, period) => {
  const d = { ...pd };
  d.history = [...(d.history || []), { date, period }];
  const currentStock = d.stock[d.stock.length - 1];
  currentStock.usesLogged = (currentStock.usesLogged || 0) + 1;

  if (d.calibrating) {
    d.calibrationUses = (d.calibrationUses || 0) + 1;
    const start = new Date(d.calibrationStart + "T12:00:00");
    const today = new Date(date + "T12:00:00");
    const daysPassed = Math.max(1, Math.ceil((today - start) / 86400000));
    if (daysPassed >= d.calibrationDays) {
      // Auto-complete calibration
      const usesPerDay = d.calibrationUses / daysPassed;
      d.calibrating = false;
      d.learnedUsesPerDay = usesPerDay;
      d.learnedDuration = Math.round(d.calibrationUses / usesPerDay);
    }
  }
  return d;
};

const completeCalibration = (pd, emptyDate) => {
  const d = { ...pd };
  const start = new Date(d.calibrationStart + "T12:00:00");
  const end = new Date(emptyDate + "T12:00:00");
  const days = Math.max(1, Math.ceil((end - start) / 86400000));
  const uses = d.calibrationUses || 1;
  d.calibrating = false;
  d.learnedUsesPerDay = uses / days;
  d.learnedDuration = days;
  return d;
};

const restockProduct = (pd, date) => {
  const d = { ...pd };
  let estimatedEmpty = null;
  if (d.learnedDuration) {
    const restockDate = new Date(date + "T12:00:00");
    restockDate.setDate(restockDate.getDate() + d.learnedDuration);
    estimatedEmpty = restockDate.toISOString().split("T")[0];
  }
  d.stock = [...(d.stock || []), { restockedAt: date, estimatedEmpty, usesLogged: 0, notified: false }];
  return d;
};

const getStockStatus = (pd) => {
  if (!pd) return null;
  const stock = pd.stock?.[pd.stock.length - 1];
  if (!stock?.estimatedEmpty) return null;
  const today = new Date();
  const empty = new Date(stock.estimatedEmpty + "T12:00:00");
  const daysLeft = Math.ceil((empty - today) / 86400000);
  return { daysLeft, estimatedEmpty: stock.estimatedEmpty };
};

// ─── Main App ─────────────────────────────────────────────────
function App() {
  const [category, setCategory] = useState(() => ls.get("glow_category", "facial"));
  const [tab, setTab] = useState("today");
  const [selDate, setSelDate] = useState(todayStr());
  const [calMonth, setCalMonth] = useState({ y: new Date().getFullYear(), m: new Date().getMonth() });

  const [logs, setLogs] = useState(() => ls.get("glow_logs", {}));
  const [products, setProducts] = useState(() => ls.get("glow_products", { morning: [...DEFAULT_MORNING], evening: [...DEFAULT_EVENING] }));
  const [productData, setProductData] = useState(() => ls.get("glow_productdata", {}));
  const [ingredients, setIngredients] = useState(() => ls.get("glow_ingredients", {}));
  const [productMeta, setProductMeta] = useState(() => ls.get("glow_product_meta", {}));
  const [photos, setPhotos] = useState(() => ls.get("glow_photos", {}));
  const [treatments, setTreatments] = useState(() => ls.get("glow_treatments", []));
  const [uvData, setUvData] = useState(null);
  const [uvLoading, setUvLoading] = useState(false);
  const [location, setLocation] = useState(() => ls.get("glow_location", null));

  const [saved, setSaved] = useState(false);
  const [modal, setModal] = useState(null);

  // Body Skin: weekly product schedule
  const [bodyProducts, setBodyProducts] = useState(() => ls.get("glow_body_products", [...DEFAULT_BODY_PRODUCTS]));
  const [bodySchedule, setBodySchedule] = useState(() => ls.get("glow_body_schedule", {}));
  const [bodyLogs, setBodyLogs] = useState(() => ls.get("glow_body_logs", {}));
  const [bodyProductData, setBodyProductData] = useState(() => ls.get("glow_body_productdata", {}));
  const [bodyReminders, setBodyReminders] = useState(() => ls.get("glow_body_reminders", false));

  // Hair: weekly product schedule + haircut tracker
  const [hairProducts, setHairProducts] = useState(() => ls.get("glow_hair_products", [...DEFAULT_HAIR_PRODUCTS]));
  const [hairSchedule, setHairSchedule] = useState(() => ls.get("glow_hair_schedule", {}));
  const [hairLogs, setHairLogs] = useState(() => ls.get("glow_hair_logs", {}));
  const [hairProductData, setHairProductData] = useState(() => ls.get("glow_hair_productdata", {}));
  const [hairReminders, setHairReminders] = useState(() => ls.get("glow_hair_reminders", false));
  const [haircuts, setHaircuts] = useState(() => ls.get("glow_haircuts", []));
  const [haircutFreqWeeks, setHaircutFreqWeeks] = useState(() => ls.get("glow_haircut_freq", 6));

  // Stock: every product the user owns, per category. Brand, notes, price etc. live in productMeta.
  // First run after this update: seed stock from the products already in the routines/schedules.
  // TikTok Try: trends and products being tried, each with a tracker, observations and a reflection
  const [trials, setTrials] = useState(() => ls.get("glow_tiktok", []));

  const [stock, setStock] = useState(() => {
    const saved = ls.get("glow_stock", null);
    if (saved) return { facial: saved.facial || [], body: saved.body || [], hair: saved.hair || [] };
    const uniq = (a) => [...new Set(a)];
    const p = ls.get("glow_products", { morning: [...DEFAULT_MORNING], evening: [...DEFAULT_EVENING] });
    return {
      facial: uniq([...(p.morning || []), ...(p.evening || [])]),
      body: uniq(ls.get("glow_body_products", [...DEFAULT_BODY_PRODUCTS])),
      hair: uniq(ls.get("glow_hair_products", [...DEFAULT_HAIR_PRODUCTS])),
    };
  });

  useEffect(() => { ls.set("glow_category", category); }, [category]);
  useEffect(() => { ls.set("glow_logs", logs); }, [logs]);
  useEffect(() => { ls.set("glow_products", products); }, [products]);
  useEffect(() => { ls.set("glow_productdata", productData); }, [productData]);
  useEffect(() => { ls.set("glow_ingredients", ingredients); }, [ingredients]);
  useEffect(() => { ls.set("glow_product_meta", productMeta); }, [productMeta]);
  useEffect(() => { ls.set("glow_photos", photos); }, [photos]);
  useEffect(() => { ls.set("glow_treatments", treatments); }, [treatments]);
  useEffect(() => { ls.set("glow_body_products", bodyProducts); }, [bodyProducts]);
  useEffect(() => { ls.set("glow_body_schedule", bodySchedule); }, [bodySchedule]);
  useEffect(() => { ls.set("glow_body_logs", bodyLogs); }, [bodyLogs]);
  useEffect(() => { ls.set("glow_body_productdata", bodyProductData); }, [bodyProductData]);
  useEffect(() => { ls.set("glow_body_reminders", bodyReminders); }, [bodyReminders]);
  useEffect(() => { ls.set("glow_hair_products", hairProducts); }, [hairProducts]);
  useEffect(() => { ls.set("glow_hair_schedule", hairSchedule); }, [hairSchedule]);
  useEffect(() => { ls.set("glow_hair_logs", hairLogs); }, [hairLogs]);
  useEffect(() => { ls.set("glow_hair_productdata", hairProductData); }, [hairProductData]);
  useEffect(() => { ls.set("glow_hair_reminders", hairReminders); }, [hairReminders]);
  useEffect(() => { ls.set("glow_haircuts", haircuts); }, [haircuts]);
  useEffect(() => { ls.set("glow_haircut_freq", haircutFreqWeeks); }, [haircutFreqWeeks]);
  useEffect(() => { ls.set("glow_stock", stock); }, [stock]);
  useEffect(() => { ls.set("glow_tiktok", trials); }, [trials]);

  // ── UV fetch
  const fetchUV = useCallback(async (lat, lon) => {
    setUvLoading(true);
    try {
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=uv_index_max&timezone=auto&forecast_days=1`);
      const data = await res.json();
      const uv = data?.daily?.uv_index_max?.[0];
      if (uv != null) setUvData({ uv: Math.round(uv * 10) / 10, lat, lon });
    } catch { setUvData({ uv: null }) }
    setUvLoading(false);
  }, []);

  const requestLocation = useCallback(() => {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(pos => {
      const { latitude: lat, longitude: lon } = pos.coords;
      setLocation({ lat, lon });
      ls.set("glow_location", { lat, lon });
      fetchUV(lat, lon);
    }, () => setUvData({ uv: null }));
  }, [fetchUV]);

  useEffect(() => {
    if (location?.lat) fetchUV(location.lat, location.lon);
  }, []);

  const flash = () => { setSaved(true); setTimeout(() => setSaved(false), 900); };

  // ── Log helpers
  const getLog = (d) => logs[d] || { morning: {}, evening: {}, condition: null, mood: null, notes: "" };
  const updLog = (d, u) => { setLogs(p => ({ ...p, [d]: { ...getLog(d), ...u } })); flash(); };

  const toggleStep = (d, period, step) => {
    const l = getLog(d);
    const wasChecked = l[period]?.[step];
    updLog(d, { [period]: { ...l[period], [step]: !wasChecked } });
    // Log product use for tracker
    if (!wasChecked) {
      setProductData(prev => {
        const pd = prev[step] ? { ...prev[step] } : initProductData();
        return { ...prev, [step]: logProductUse(pd, d, period) };
      });
    }
  };

  const completionRate = (d) => {
    const l = getLog(d); const all = [...products.morning, ...products.evening];
    if (!all.length) return 0;
    return Math.round(all.filter(s => l.morning[s] || l.evening[s]).length / all.length * 100);
  };
  const hasLog = (d) => { const l = logs[d]; return l && (Object.values(l.morning || {}).some(Boolean) || Object.values(l.evening || {}).some(Boolean) || l.condition || l.mood); };

  const [newProd, setNewProd] = useState({ morning: "", evening: "" });
  const [addingProd, setAddingProd] = useState(null);
  const addProduct = (period, name) => {
    const v = (name || newProd[period]).trim(); if (!v) return;
    if (products[period].includes(v)) return;
    setProducts(p => ({ ...p, [period]: [...p[period], v] }));
    // keep existing tracker data if this product was used before
    setProductData(prev => ({ ...prev, [v]: prev[v] || initProductData() }));
    setStock(s => (s.facial || []).includes(v) ? s : { ...s, facial: [...(s.facial || []), v] });
    setNewProd(p => ({ ...p, [period]: "" }));
  };
  const removeProd = (period, i) => setProducts(p => ({ ...p, [period]: p[period].filter((_, idx) => idx !== i) }));
  const renameFacialProduct = (period, oldName, newName) => {
    const v = (newName || "").trim();
    if (!v || v === oldName || products[period].includes(v)) return;
    setProducts(p => ({ ...p, [period]: p[period].map(n => n === oldName ? v : n) }));
    setStock(s => ({ ...s, facial: (s.facial || []).map(n => n === oldName ? v : n) }));
    setProductData(prev => { const c = { ...prev }; if (c[oldName]) { c[v] = c[oldName]; delete c[oldName]; } return c; });
    setIngredients(prev => { const c = { ...prev }; if (c[oldName]) { c[v] = c[oldName]; delete c[oldName]; } return c; });
    setProductMeta(prev => { const c = { ...prev }; if (c[oldName]) { c[v] = c[oldName]; delete c[oldName]; } return c; });
    setLogs(prev => {
      const c = {};
      for (const [date, l] of Object.entries(prev)) {
        const nl = { ...l };
        if (nl[period] && Object.prototype.hasOwnProperty.call(nl[period], oldName)) {
          const periodObj = { ...nl[period] };
          periodObj[v] = periodObj[oldName];
          delete periodObj[oldName];
          nl[period] = periodObj;
        }
        c[date] = nl;
      }
      return c;
    });
  };

  const addTreatment = (t) => setTreatments(p => [...p, { ...t, id: Date.now(), history: [] }]);
  const logTreatment = (id, date) => setTreatments(p => p.map(t => t.id === id ? { ...t, history: [...(t.history || []), date], lastDone: date } : t));
  const removeTreatment = (id) => setTreatments(p => p.filter(t => t.id !== id));

  const addPhoto = (dateStr, photoObj) => setPhotos(p => ({ ...p, [dateStr]: [...(p[dateStr] || []), { ...photoObj, id: Date.now() }] }));
  const removePhoto = (dateStr, id) => setPhotos(p => ({ ...p, [dateStr]: (p[dateStr] || []).filter(ph => ph.id !== id) }));

  const streak = (() => { let s = 0; const t = new Date(); for (let i = 0; i < 60; i++) { const d = new Date(t); d.setDate(d.getDate() - i); if (hasLog(d.toISOString().split("T")[0])) s++; else break; } return s; })();

  // ── Low stock alerts
  const stockAlerts = [...products.morning, ...products.evening].map(name => {
    const pd = productData[name];
    const status = getStockStatus(pd);
    if (!status) return null;
    if (status.daysLeft <= 7) return { name, daysLeft: status.daysLeft, estimatedEmpty: status.estimatedEmpty };
    return null;
  }).filter(Boolean);

  // ── Body Skin: schedule + tracker helpers
  const getBodyLog = (d) => bodyLogs[d] || {};
  const toggleBodyProduct = (d, name) => {
    const l = getBodyLog(d);
    const was = !!l[name];
    setBodyLogs(p => ({ ...p, [d]: { ...l, [name]: !was } }));
    flash();
    if (!was) {
      setBodyProductData(prev => {
        const pd = prev[name] ? { ...prev[name] } : initProductData();
        return { ...prev, [name]: logProductUse(pd, d, "body") };
      });
    }
  };
  const addBodyProduct = (name) => {
    const v = (name || "").trim(); if (!v || bodyProducts.includes(v)) return;
    setBodyProducts(p => [...p, v]);
    setBodySchedule(p => ({ ...p, [v]: p[v] || [] }));
    setBodyProductData(prev => ({ ...prev, [v]: prev[v] || initProductData() }));
    setStock(s => (s.body || []).includes(v) ? s : { ...s, body: [...(s.body || []), v] });
  };
  const removeBodyProduct = (name) => {
    setBodyProducts(p => p.filter(n => n !== name));
    setBodySchedule(p => { const c = { ...p }; delete c[name]; return c; });
  };
  const renameBodyProduct = (oldName, newName) => {
    const v = (newName || "").trim();
    if (!v || v === oldName || bodyProducts.includes(v)) return;
    setBodyProducts(p => p.map(n => n === oldName ? v : n));
    setStock(s => ({ ...s, body: (s.body || []).map(n => n === oldName ? v : n) }));
    setBodySchedule(prev => { const c = { ...prev }; if (c[oldName]) { c[v] = c[oldName]; delete c[oldName]; } return c; });
    setBodyProductData(prev => { const c = { ...prev }; if (c[oldName]) { c[v] = c[oldName]; delete c[oldName]; } return c; });
    setIngredients(prev => { const c = { ...prev }; if (c[oldName]) { c[v] = c[oldName]; delete c[oldName]; } return c; });
    setProductMeta(prev => { const c = { ...prev }; if (c[oldName]) { c[v] = c[oldName]; delete c[oldName]; } return c; });
    setBodyLogs(prev => {
      const c = {};
      for (const [date, l] of Object.entries(prev)) {
        const nl = { ...l };
        if (Object.prototype.hasOwnProperty.call(nl, oldName)) { nl[v] = nl[oldName]; delete nl[oldName]; }
        c[date] = nl;
      }
      return c;
    });
  };
  const toggleBodyScheduleDay = (name, day) => {
    setBodySchedule(p => {
      const days = p[name] || [];
      const has = days.includes(day);
      return { ...p, [name]: has ? days.filter(d => d !== day) : [...days, day] };
    });
  };
  const enableBodyReminders = () => {
    if (!("Notification" in window)) { setBodyReminders(false); return; }
    if (Notification.permission === "granted") { setBodyReminders(true); return; }
    Notification.requestPermission().then(perm => setBodyReminders(perm === "granted"));
  };

  // Best-effort same-day reminder: fires while the app is open (no server, so true background push isn't possible here)
  useEffect(() => {
    if (!bodyReminders) return;
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    const today = todayStr();
    if (ls.get("glow_body_last_notified", null) === today) return;
    const todayCode = DAYS_SHORT[new Date().getDay()];
    const todayLog = getBodyLog(today);
    const due = bodyProducts.filter(n => (bodySchedule[n] || []).includes(todayCode) && !todayLog[n]);
    if (due.length > 0) {
      try { new Notification("glōw — body care reminder", { body: `Scheduled today: ${due.join(", ")}` }); } catch {}
      ls.set("glow_body_last_notified", today);
    }
  }, [bodyReminders, bodyProducts, bodySchedule, bodyLogs]);

  const bodyStockAlerts = bodyProducts.map(name => {
    const pd = bodyProductData[name];
    const status = getStockStatus(pd);
    if (!status) return null;
    if (status.daysLeft <= 7) return { name, daysLeft: status.daysLeft, estimatedEmpty: status.estimatedEmpty };
    return null;
  }).filter(Boolean);

  // ── Hair: schedule + tracker helpers
  const getHairLog = (d) => hairLogs[d] || {};
  const toggleHairProduct = (d, name) => {
    const l = getHairLog(d);
    const was = !!l[name];
    setHairLogs(p => ({ ...p, [d]: { ...l, [name]: !was } }));
    flash();
    if (!was) {
      setHairProductData(prev => {
        const pd = prev[name] ? { ...prev[name] } : initProductData();
        return { ...prev, [name]: logProductUse(pd, d, "hair") };
      });
    }
  };
  const addHairProduct = (name) => {
    const v = (name || "").trim(); if (!v || hairProducts.includes(v)) return;
    setHairProducts(p => [...p, v]);
    setHairSchedule(p => ({ ...p, [v]: p[v] || [] }));
    setHairProductData(prev => ({ ...prev, [v]: prev[v] || initProductData() }));
    setStock(s => (s.hair || []).includes(v) ? s : { ...s, hair: [...(s.hair || []), v] });
  };
  const removeHairProduct = (name) => {
    setHairProducts(p => p.filter(n => n !== name));
    setHairSchedule(p => { const c = { ...p }; delete c[name]; return c; });
  };
  const renameHairProduct = (oldName, newName) => {
    const v = (newName || "").trim();
    if (!v || v === oldName || hairProducts.includes(v)) return;
    setHairProducts(p => p.map(n => n === oldName ? v : n));
    setStock(s => ({ ...s, hair: (s.hair || []).map(n => n === oldName ? v : n) }));
    setHairSchedule(prev => { const c = { ...prev }; if (c[oldName]) { c[v] = c[oldName]; delete c[oldName]; } return c; });
    setHairProductData(prev => { const c = { ...prev }; if (c[oldName]) { c[v] = c[oldName]; delete c[oldName]; } return c; });
    setIngredients(prev => { const c = { ...prev }; if (c[oldName]) { c[v] = c[oldName]; delete c[oldName]; } return c; });
    setProductMeta(prev => { const c = { ...prev }; if (c[oldName]) { c[v] = c[oldName]; delete c[oldName]; } return c; });
    setHairLogs(prev => {
      const c = {};
      for (const [date, l] of Object.entries(prev)) {
        const nl = { ...l };
        if (Object.prototype.hasOwnProperty.call(nl, oldName)) { nl[v] = nl[oldName]; delete nl[oldName]; }
        c[date] = nl;
      }
      return c;
    });
  };
  const toggleHairScheduleDay = (name, day) => {
    setHairSchedule(p => {
      const days = p[name] || [];
      const has = days.includes(day);
      return { ...p, [name]: has ? days.filter(d => d !== day) : [...days, day] };
    });
  };
  const enableHairReminders = () => {
    if (!("Notification" in window)) { setHairReminders(false); return; }
    if (Notification.permission === "granted") { setHairReminders(true); return; }
    Notification.requestPermission().then(perm => setHairReminders(perm === "granted"));
  };

  useEffect(() => {
    if (!hairReminders) return;
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    const today = todayStr();
    if (ls.get("glow_hair_last_notified", null) === today) return;
    const todayCode = DAYS_SHORT[new Date().getDay()];
    const todayLog = getHairLog(today);
    const due = hairProducts.filter(n => (hairSchedule[n] || []).includes(todayCode) && !todayLog[n]);
    if (due.length > 0) {
      try { new Notification("glōw — hair care reminder", { body: `Scheduled today: ${due.join(", ")}` }); } catch {}
      ls.set("glow_hair_last_notified", today);
    }
  }, [hairReminders, hairProducts, hairSchedule, hairLogs]);

  const hairStockAlerts = hairProducts.map(name => {
    const pd = hairProductData[name];
    const status = getStockStatus(pd);
    if (!status) return null;
    if (status.daysLeft <= 7) return { name, daysLeft: status.daysLeft, estimatedEmpty: status.estimatedEmpty };
    return null;
  }).filter(Boolean);

  // ── Stock helpers
  const addToStock = (scope, name, brand, notes) => {
    const v = (name || "").trim(); if (!v) return;
    setStock(s => (s[scope] || []).includes(v) ? s : { ...s, [scope]: [...(s[scope] || []), v] });
    const b = (brand || "").trim(), n = (notes || "").trim();
    if (b || n) {
      setProductMeta(p => {
        const m = p[v] || { incompatible: [], price: "" };
        return { ...p, [v]: { ...m, brand: b || m.brand || "", notes: n || m.notes || "" } };
      });
    }
  };
  const removeFromStock = (scope, name) => setStock(s => ({ ...s, [scope]: (s[scope] || []).filter(n => n !== name) }));
  const renameStockItem = (scope, oldName, newName) => {
    const v = (newName || "").trim();
    if (!v || v === oldName || (stock[scope] || []).includes(v)) return;
    // rename wherever the product is currently in use
    if (scope === "facial") {
      ["morning", "evening"].forEach(per => { if (products[per].includes(oldName)) renameFacialProduct(per, oldName, v); });
    } else if (scope === "body") {
      if (bodyProducts.includes(oldName)) renameBodyProduct(oldName, v);
    } else {
      if (hairProducts.includes(oldName)) renameHairProduct(oldName, v);
    }
    setStock(s => ({ ...s, [scope]: (s[scope] || []).map(n => n === oldName ? v : n) }));
    // keep details attached even when the product isn't in a routine
    const move = (setter) => setter(prev => { const c = { ...prev }; if (c[oldName]) { c[v] = c[oldName]; delete c[oldName]; } return c; });
    move(setIngredients); move(setProductMeta);
    if (scope === "facial") move(setProductData); else if (scope === "body") move(setBodyProductData); else move(setHairProductData);
  };

  // ── TikTok Try helpers
  const addTrial = (t) => setTrials(p => [...p, { observations: [], checkins: {}, reflection: null, verdict: null, ...t, id: Date.now() }]);
  const updateTrial = (id, patch) => setTrials(p => p.map(t => t.id === id ? { ...t, ...(typeof patch === "function" ? patch(t) : patch) } : t));
  const removeTrial = (id) => setTrials(p => p.filter(t => t.id !== id));
  const reflectionsDue = trials.filter(t => t.status === "active" && todayStr() >= t.endDate).length;

  // ── Haircut tracker
  const addHaircut = (entry) => setHaircuts(p => [...p, { ...entry, id: Date.now() }]);
  const removeHaircut = (id) => setHaircuts(p => p.filter(h => h.id !== id));

  return (
    <div style={S.app}>
      <Header alerts={[...stockAlerts, ...bodyStockAlerts, ...hairStockAlerts]} />
      <CategoryTabs category={category} setCategory={setCategory} badges={{ tiktok: reflectionsDue }} />
      <div style={S.content}>
        {category === "facial" && (
          <>
            {tab === "today"      && <TodayPage selDate={selDate} setSelDate={setSelDate} getLog={getLog} updLog={updLog} toggleStep={toggleStep} products={products} newProd={newProd} setNewProd={setNewProd} addingProd={addingProd} setAddingProd={setAddingProd} addProduct={addProduct} removeProd={removeProd} completionRate={completionRate} saved={saved} ingredients={ingredients} productMeta={productMeta} photos={photos} addPhoto={addPhoto} setModal={setModal} uvData={uvData} uvLoading={uvLoading} requestLocation={requestLocation} productData={productData} setProductData={setProductData} stockAlerts={stockAlerts} stockItems={stock.facial} />}
            {tab === "calendar"   && <CalendarPage selDate={selDate} setSelDate={setSelDate} calMonth={calMonth} setCalMonth={setCalMonth} hasLog={hasLog} completionRate={completionRate} photos={photos} setTab={setTab} />}
            {tab === "photo"      && <PhotoLogPage photos={photos} setModal={setModal} addPhoto={addPhoto} removePhoto={removePhoto} selDate={selDate} />}
            {tab === "treatments" && <TreatmentsPage treatments={treatments} addTreatment={addTreatment} logTreatment={logTreatment} removeTreatment={removeTreatment} setModal={setModal} />}
            {tab === "stock"      && <StockPage items={stock.facial} inUse={[...products.morning, ...products.evening]} productMeta={productMeta} addToStock={addToStock} removeFromStock={removeFromStock} setModal={setModal} />}
            {tab === "insights"   && <InsightsPage logs={logs} products={products} streak={streak} completionRate={completionRate} hasLog={hasLog} ingredients={ingredients} treatments={treatments} productData={productData} setSelDate={setSelDate} setTab={setTab} />}
            {tab === "report"     && <ReportPage logs={logs} photos={photos} treatments={treatments} completionRate={completionRate} hasLog={hasLog} setSelDate={setSelDate} setTab={setTab} />}
          </>
        )}
        {category === "body" && (
          <BodySchedulePage
            bodyProducts={bodyProducts}
            bodySchedule={bodySchedule}
            bodyLogs={bodyLogs}
            toggleBodyProduct={toggleBodyProduct}
            addBodyProduct={addBodyProduct}
            removeBodyProduct={removeBodyProduct}
            toggleBodyScheduleDay={toggleBodyScheduleDay}
            bodyProductData={bodyProductData}
            productMeta={productMeta}
            bodyReminders={bodyReminders}
            enableBodyReminders={enableBodyReminders}
            stockItems={stock.body}
            addToStock={addToStock}
            removeFromStock={removeFromStock}
            setModal={setModal}
          />
        )}
        {category === "tiktok" && (
          <TikTokPage trials={trials} updateTrial={updateTrial} removeTrial={removeTrial} setModal={setModal} />
        )}
        {category === "hair" && (
          <HairPage
            hairProducts={hairProducts}
            hairSchedule={hairSchedule}
            hairLogs={hairLogs}
            toggleHairProduct={toggleHairProduct}
            addHairProduct={addHairProduct}
            removeHairProduct={removeHairProduct}
            toggleHairScheduleDay={toggleHairScheduleDay}
            hairProductData={hairProductData}
            productMeta={productMeta}
            hairReminders={hairReminders}
            enableHairReminders={enableHairReminders}
            stockItems={stock.hair}
            addToStock={addToStock}
            removeFromStock={removeFromStock}
            haircuts={haircuts}
            haircutFreqWeeks={haircutFreqWeeks}
            setHaircutFreqWeeks={setHaircutFreqWeeks}
            removeHaircut={removeHaircut}
            setModal={setModal}
          />
        )}
      </div>
      {category === "facial" && <NavBar tab={tab} setTab={setTab} alerts={stockAlerts.length} />}
      {modal && <Modal modal={modal} setModal={setModal} ingredients={ingredients} setIngredients={setIngredients} productMeta={productMeta} setProductMeta={setProductMeta} renameFacialProduct={renameFacialProduct} renameBodyProduct={renameBodyProduct} renameHairProduct={renameHairProduct} renameStockItem={renameStockItem} trials={trials} addTrial={addTrial} updateTrial={updateTrial} addTreatment={addTreatment} addHaircut={addHaircut} addPhoto={addPhoto} selDate={selDate} productData={productData} setProductData={setProductData} bodyProductData={bodyProductData} setBodyProductData={setBodyProductData} hairProductData={hairProductData} setHairProductData={setHairProductData} />}
    </div>
  );
}

// ─── Body Skin: weekly product schedule ─────────────────────────
function BodySchedulePage({ bodyProducts, bodySchedule, bodyLogs, toggleBodyProduct, addBodyProduct, removeBodyProduct, toggleBodyScheduleDay, bodyProductData, productMeta, bodyReminders, enableBodyReminders, stockItems, addToStock, removeFromStock, setModal }) {
  const today = todayStr();
  const todayCode = DAYS_SHORT[new Date().getDay()];
  const todayLog = bodyLogs[today] || {};
  const dueToday = bodyProducts.filter(n => (bodySchedule[n] || []).includes(todayCode));
  const [adding, setAdding] = useState(false);

  return (
    <div style={S.page}>
      <div style={S.pageTitle}>Body Skin</div>

      {/* Reminders */}
      <div style={S.card}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
          <div>
            <div style={S.cardTitle}>🔔 Reminders</div>
            <div style={{ fontSize: 12, color: "#7a6e5a", lineHeight: 1.5 }}>
              {bodyReminders
                ? "Reminders are on — you'll get a nudge for scheduled products when the app is open."
                : "Get a nudge on scheduled days. Works while the app is open in your browser."}
            </div>
          </div>
          {!bodyReminders && <button style={S.uvLocationBtn} onClick={enableBodyReminders}>Enable</button>}
        </div>
      </div>

      {/* Today */}
      <div style={S.card}>
        <div style={S.cardTitle}>🗓 Today — {fmtDate(today).day}</div>
        {dueToday.length === 0 ? (
          <div style={S.emptySmall}>Nothing scheduled today</div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 6 }}>
            {dueToday.map(name => {
              const pd = bodyProductData[name];
              const stockStatus = getStockStatus(pd);
              const isCalibrating = pd?.calibrating;
              const meta = productMeta[name];
              const isLow = stockStatus && stockStatus.daysLeft <= 7;
              const checked = !!todayLog[name];
              return (
                <div key={name} style={S.stepRow}>
                  <button style={{ ...S.checkbox, ...(checked ? { background: "#7a9e7e", borderColor: "#7a9e7e" } : {}) }} onClick={() => toggleBodyProduct(today, name)}>
                    {checked && <span style={S.checkmark}>✓</span>}
                  </button>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                      <span style={{ ...S.stepName, textDecoration: checked ? "line-through" : "none", opacity: checked ? 0.45 : 1 }}>{name}</span>
                      {isLow && <span style={S.lowBadge}>low</span>}
                      {isCalibrating && <span style={S.calBadge}>calibrating</span>}
                    </div>
                    {meta?.brand && <div style={S.brandPreview}>{meta.brand}</div>}
                    {meta?.notes && <div style={{ ...S.noteReminder, opacity: checked ? 0.55 : 1 }}>📌 {meta.notes}</div>}
                    {stockStatus && !isLow && <div style={S.stockPreview}>~{stockStatus.daysLeft}d left</div>}
                    {meta?.price && <div style={S.pricePreview}>💰 {meta.price}</div>}
                    {meta?.incompatible?.length > 0 && <div style={S.incompPreview}>⚠ avoid with {meta.incompatible.slice(0, 2).join(", ")}{meta.incompatible.length > 2 ? ` +${meta.incompatible.length - 2}` : ""}</div>}
                  </div>
                  <button style={S.iconBtn} title="Product details" onClick={() => setModal({ type: "productDetails", product: name, scope: "body" })}>🧪</button>
                  <button style={S.iconBtn} title="Product tracker" onClick={() => setModal({ type: "bodyProductTracker", product: name })}>📦</button>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* Weekly schedule */}
      <div style={S.card}>
        <div style={S.cardTitle}>📅 Weekly Schedule</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
          {bodyProducts.map(name => {
            const pd = bodyProductData[name];
            const stockStatus = getStockStatus(pd);
            const meta = productMeta[name];
            const isLow = stockStatus && stockStatus.daysLeft <= 7;
            return (
              <div key={name}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                    <span style={{ fontSize: 13, fontWeight: "700", color: "#3a4a3a" }}>{name}</span>
                    {meta?.brand && <span style={S.brandInline}>· {meta.brand}</span>}
                    {isLow && <span style={S.lowBadge}>low</span>}
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <button style={S.iconBtn} title="Product details" onClick={() => setModal({ type: "productDetails", product: name, scope: "body" })}>🧪</button>
                    <button style={S.iconBtn} title="Product tracker" onClick={() => setModal({ type: "bodyProductTracker", product: name })}>📦</button>
                    <button style={S.removeBtn} onClick={() => removeBodyProduct(name)}>×</button>
                  </div>
                </div>
                {(meta?.price || meta?.incompatible?.length > 0) && (
                  <div style={{ marginBottom: 6 }}>
                    {meta?.price && <div style={S.pricePreview}>💰 {meta.price}</div>}
                    {meta?.incompatible?.length > 0 && <div style={S.incompPreview}>⚠ avoid with {meta.incompatible.slice(0, 2).join(", ")}{meta.incompatible.length > 2 ? ` +${meta.incompatible.length - 2}` : ""}</div>}
                  </div>
                )}
                <div style={{ display: "flex", gap: 5 }}>
                  {DAYS_SHORT.map(day => {
                    const active = (bodySchedule[name] || []).includes(day);
                    return (
                      <button key={day} style={{ ...S.dayChip, ...(active ? S.dayChipActive : {}) }} onClick={() => toggleBodyScheduleDay(name, day)}>{day}</button>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
        {adding ? (
          <ProductPicker available={(stockItems || []).filter(n => !bodyProducts.includes(n))} productMeta={productMeta} onPick={addBodyProduct} onAddNew={(n) => { addBodyProduct(n); setAdding(false); }} onClose={() => setAdding(false)} />
        ) : (
          <button style={{ ...S.dashedBtn, marginTop: 14 }} onClick={() => setAdding(true)}>+ Add product</button>
        )}
      </div>

      {/* Stock */}
      <StockCard scope="body" items={stockItems || []} inUse={bodyProducts} productMeta={productMeta} addToStock={addToStock} removeFromStock={removeFromStock} setModal={setModal} />
    </div>
  );
}

// ─── Hair: weekly product schedule + haircut tracker ────────────
function HairPage({ hairProducts, hairSchedule, hairLogs, toggleHairProduct, addHairProduct, removeHairProduct, toggleHairScheduleDay, hairProductData, productMeta, hairReminders, enableHairReminders, haircuts, haircutFreqWeeks, setHaircutFreqWeeks, removeHaircut, stockItems, addToStock, removeFromStock, setModal }) {

  const dueToday = hairProducts.filter(n => (hairSchedule[n] || []).includes(todayCode));
  const [adding, setAdding] = useState(false);

  const sortedCuts = [...haircuts].sort((a, b) => b.date.localeCompare(a.date));
  const lastCut = sortedCuts[0];
  const daysSince = lastCut ? Math.floor((new Date(today + "T12:00:00") - new Date(lastCut.date + "T12:00:00")) / 86400000) : null;
  const freqDays = haircutFreqWeeks * 7;
  const daysUntilDue = lastCut ? freqDays - daysSince : null;
  const cutStatus = !lastCut ? "none" : daysUntilDue <= 0 ? "overdue" : daysUntilDue <= 5 ? "soon" : "ok";
  const cutStatusColor = { none: "#9a9a8a", overdue: "#d4846a", soon: "#e8b86a", ok: "#7a9e7e" }[cutStatus];
  const cutStatusLabel = { none: "No cuts logged", overdue: `Overdue ${Math.abs(daysUntilDue)}d`, soon: `Due in ${daysUntilDue}d`, ok: `Due in ${daysUntilDue}d` }[cutStatus];

  return (
    <div style={S.page}>
      <div style={S.pageTitle}>Hair</div>

      {/* Reminders */}
      <div style={S.card}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
          <div>
            <div style={S.cardTitle}>🔔 Reminders</div>
            <div style={{ fontSize: 12, color: "#7a6e5a", lineHeight: 1.5 }}>
              {hairReminders
                ? "Reminders are on — you'll get a nudge for scheduled products when the app is open."
                : "Get a nudge on scheduled days. Works while the app is open in your browser."}
            </div>
          </div>
          {!hairReminders && <button style={S.uvLocationBtn} onClick={enableHairReminders}>Enable</button>}
        </div>
      </div>

      {/* Haircut Tracker */}
      <div style={S.card}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
          <div style={S.cardTitle}>✂️ Haircut Tracker</div>

        </div>
        {lastCut ? (
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
            <div>
              <div style={{ fontSize: 13, color: "#4a5c4a", fontWeight: "600" }}>{fmtDate(lastCut.date).month} {fmtDate(lastCut.date).date} · {daysSince}d ago</div>
              {(lastCut.salon || lastCut.price) && <div style={{ fontSize: 11, color: "#9a8e7a", marginTop: 2 }}>{[lastCut.salon, lastCut.price].filter(Boolean).join(" · ")}</div>}
            </div>
            <span style={{ ...S.statusBadge, background: cutStatusColor + "22", color: cutStatusColor }}>{cutStatusLabel}</span>
          </div>
        ) : (
          <div style={S.emptySmall}>No haircuts logged yet</div>
        )}
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 11, color: "#7a6e5a" }}>Remind me every</span>
          <select style={{ ...S.formSelect, width: "auto", padding: "5px 10px", fontSize: 12 }} value={haircutFreqWeeks} onChange={e => setHaircutFreqWeeks(Number(e.target.value))}>
            {HAIRCUT_FREQUENCIES.map(w => <option key={w} value={w}>{w} weeks</option>)}
          </select>
        </div>
        {sortedCuts.length > 0 && (
          <div style={{ marginTop: 14 }}>
            <div style={S.monthLabel}>History</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
              {sortedCuts.map(h => (
                <div key={h.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", padding: "7px 0", borderBottom: "1px solid #f5f0e8" }}>
                  <div>
                    <div style={{ fontSize: 12, color: "#3a4a3a" }}>{fmtDate(h.date).month.slice(0, 3)} {fmtDate(h.date).date}, {fmtDate(h.date).year}</div>
                    {(h.salon || h.price) && <div style={{ fontSize: 11, color: "#9a8e7a" }}>{[h.salon, h.price].filter(Boolean).join(" · ")}</div>}
                    {h.notes && <div style={{ fontSize: 11, color: "#9a8e7a", fontStyle: "italic" }}>{h.notes}</div>}
                  </div>
                  <button style={S.removeBtn} onClick={() => removeHaircut(h.id)}>×</button>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      {/* Today */}
      <div style={S.card}>
        <div style={S.cardTitle}>🗓 Today — {fmtDate(today).day}</div>
        {dueToday.length === 0 ? (
          <div style={S.emptySmall}>Nothing scheduled today</div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 6 }}>
            {dueToday.map(name => {
              const pd = hairProductData[name];
              const stockStatus = getStockStatus(pd);
              const isCalibrating = pd?.calibrating;
              const meta = productMeta[name];
              const isLow = stockStatus && stockStatus.daysLeft <= 7;
              const checked = !!todayLog[name];
              return (
                <div key={name} style={S.stepRow}>
                  <button style={{ ...S.checkbox, ...(checked ? { background: "#7a9e7e", borderColor: "#7a9e7e" } : {}) }} onClick={() => toggleHairProduct(today, name)}>
                    {checked && <span style={S.checkmark}>✓</span>}
                  </button>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                      <span style={{ ...S.stepName, textDecoration: checked ? "line-through" : "none", opacity: checked ? 0.45 : 1 }}>{name}</span>
                      {isLow && <span style={S.lowBadge}>low</span>}
                      {isCalibrating && <span style={S.calBadge}>calibrating</span>}
                    </div>
                    {meta?.brand && <div style={S.brandPreview}>{meta.brand}</div>}
                    {meta?.notes && <div style={{ ...S.noteReminder, opacity: checked ? 0.55 : 1 }}>📌 {meta.notes}</div>}
                    {stockStatus && !isLow && <div style={S.stockPreview}>~{stockStatus.daysLeft}d left</div>}
                    {meta?.price && <div style={S.pricePreview}>💰 {meta.price}</div>}
                    {meta?.incompatible?.length > 0 && <div style={S.incompPreview}>⚠ avoid with {meta.incompatible.slice(0, 2).join(", ")}{meta.incompatible.length > 2 ? ` +${meta.incompatible.length - 2}` : ""}</div>}
                  </div>
                  <button style={S.iconBtn} title="Product details" onClick={() => setModal({ type: "productDetails", product: name, scope: "hair" })}>🧪</button>
                  <button style={S.iconBtn} title="Product tracker" onClick={() => setModal({ type: "hairProductTracker", product: name })}>📦</button>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* Weekly schedule */}
      <div style={S.card}>
        <div style={S.cardTitle}>📅 Weekly Schedule</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
          {hairProducts.map(name => {
            const pd = hairProductData[name];
            const stockStatus = getStockStatus(pd);
            const meta = productMeta[name];
            const isLow = stockStatus && stockStatus.daysLeft <= 7;
            return (
              <div key={name}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                    <span style={{ fontSize: 13, fontWeight: "700", color: "#3a4a3a" }}>{name}</span>
                    {meta?.brand && <span style={S.brandInline}>· {meta.brand}</span>}
                    {isLow && <span style={S.lowBadge}>low</span>}
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <button style={S.iconBtn} title="Product details" onClick={() => setModal({ type: "productDetails", product: name, scope: "hair" })}>🧪</button>
                    <button style={S.iconBtn} title="Product tracker" onClick={() => setModal({ type: "hairProductTracker", product: name })}>📦</button>
                    <button style={S.removeBtn} onClick={() => removeHairProduct(name)}>×</button>
                  </div>
                </div>
                {(meta?.price || meta?.incompatible?.length > 0) && (
                  <div style={{ marginBottom: 6 }}>
                    {meta?.price && <div style={S.pricePreview}>💰 {meta.price}</div>}
                    {meta?.incompatible?.length > 0 && <div style={S.incompPreview}>⚠ avoid with {meta.incompatible.slice(0, 2).join(", ")}{meta.incompatible.length > 2 ? ` +${meta.incompatible.length - 2}` : ""}</div>}
                  </div>
                )}
                <div style={{ display: "flex", gap: 5 }}>
                  {DAYS_SHORT.map(day => {
                    const active = (hairSchedule[name] || []).includes(day);
                    return (
                      <button key={day} style={{ ...S.dayChip, ...(active ? S.dayChipActive : {}) }} onClick={() => toggleHairScheduleDay(name, day)}>{day}</button>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
        {adding ? (
          <ProductPicker available={(stockItems || []).filter(n => !hairProducts.includes(n))} productMeta={productMeta} onPick={addHairProduct} onAddNew={(n) => { addHairProduct(n); setAdding(false); }} onClose={() => setAdding(false)} />
        ) : (
          <button style={{ ...S.dashedBtn, marginTop: 14 }} onClick={() => setAdding(true)}>+ Add product</button>
        )}
      </div>

      {/* Stock */}
      <StockCard scope="hair" items={stockItems || []} inUse={hairProducts} productMeta={productMeta} addToStock={addToStock} removeFromStock={removeFromStock} setModal={setModal} />
    </div>
  );
}

// ─── Product Picker (choose from stock, or add a new product) ───
function ProductPicker({ available, productMeta, onPick, onAddNew, onClose }) {

    <div style={S.pickerWrap}>
      <div style={S.pickerLabel}>Choose from your stock</div>
      {available.length > 0 ? (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {available.map(n => (
            <button key={n} style={S.pickChip} onClick={() => onPick(n)}>
              <span>{n}</span>
              {productMeta[n]?.brand && <span style={S.pickChipBrand}>{productMeta[n].brand}</span>}

      ) : (
        <div style={S.pickerEmpty}>Nothing left in your stock to add.</div>
      )}

// ─── Stock (all products the user owns for a category) ──────────
function StockCard({ scope, items, inUse, productMeta, addToStock, removeFromStock, setModal }) {
  const [adding, setAdding] = useState(false);
  const [name, setName] = useState("");
  const [brand, setBrand] = useState("");
  const [notes, setNotes] = useState("");
  const [err, setErr] = useState("");

  const submit = () => {
    const v = name.trim(); if (!v) return;
    if (items.some(n => n.toLowerCase() === v.toLowerCase())) { setErr("That product is already in your stock."); return; }
    addToStock(scope, v, brand, notes);
    setName(""); setBrand(""); setNotes(""); setErr(""); setAdding(false);
  };
  const remove = (n) => {
    const msg = inUse.includes(n)
      ? `Remove ${n} from your stock? It stays in your routine until you remove it there.`
      : `Remove ${n} from your stock?`;
    if (window.confirm(msg)) removeFromStock(scope, n);
  };

  return (
    <div style={S.card}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
        <div style={{ ...S.cardTitle, marginBottom: 0 }}>🧴 My Stock</div>
        <span style={{ ...S.badge, background: "#7a9e7e22", color: "#5f8a63" }}>{items.length}</span>
      </div>
      <div style={{ fontSize: 11, color: "#9a8e7a", marginBottom: 6 }}>Everything you own — pick from here when building your routine.</div>

      {items.length === 0 && <div style={S.emptySmall}>No products in stock yet</div>}
      {items.map(n => {
        const meta = productMeta[n];
        return (
          <div key={n} style={S.stockRow}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                <span style={S.stockName}>{n}</span>
                {inUse.includes(n) && <span style={S.inUseChip}>in routine</span>}
              </div>
              {meta?.brand && <div style={S.brandPreview}>{meta.brand}</div>}
              {meta?.notes && <div style={S.noteReminder}>📌 {meta.notes}</div>}
            </div>
            <button style={S.iconBtn} title="Product details" onClick={() => setModal({ type: "productDetails", product: n, scope, fromStock: true })}>🧪</button>
            <button style={S.removeBtn} title="Remove from stock" onClick={() => remove(n)}>×</button>
          </div>
        );
      })}

      {adding ? (
        <div style={{ marginTop: 12 }}>
          <div style={S.formGroup}>
            <label style={S.formLabel}>Product Name</label>
            <input style={S.formInput} placeholder="e.g. Hydrating Cleanser" value={name} onChange={e => { setName(e.target.value); setErr(""); }} autoFocus />
          </div>
          <div style={S.formGroup}>
            <label style={S.formLabel}>Brand</label>
            <input style={S.formInput} placeholder="e.g. CeraVe" value={brand} onChange={e => setBrand(e.target.value)} />
          </div>
          <div style={S.formGroup}>
            <label style={{ ...S.formLabel, color: NOTE_COLOR }}>📌 Important Notes</label>
            <textarea style={{ ...S.textarea, borderColor: NOTE_COLOR + "66" }} rows={2} placeholder="e.g. Night only · patch test first" value={notes} onChange={e => setNotes(e.target.value)} />
          </div>
          {err && <div style={{ fontSize: 12, color: "#c4604a", marginBottom: 8 }}>{err}</div>}
          <div style={{ display: "flex", gap: 8 }}>
            <button style={S.cancelBtn} onClick={() => { setAdding(false); setErr(""); }}>Cancel</button>
            <button style={{ ...S.primaryBtn, flex: 1 }} onClick={submit}>Add to stock</button>
          </div>
        </div>
      ) : (
        <button style={S.dashedBtn} onClick={() => setAdding(true)}>+ Add to stock</button>
      )}
    </div>
  );
}

function StockPage({ items, inUse, productMeta, addToStock, removeFromStock, setModal }) {
  return (

// ─── TikTok Try ────────────────────────────────────────────────
function TikTokPage({ trials, updateTrial, removeTrial, setModal }) {
  const today = todayStr();
  const isDue = (t) => t.status === "active" && today >= t.endDate;
  const due = trials.filter(isDue);
  const running = trials.filter(t => t.status === "active" && !isDue(t));
  const ideas = trials.filter(t => t.status === "idea");
  const done = trials.filter(t => t.status === "done").sort((a, b) => (b.reflection?.reflectedOn || "").localeCompare(a.reflection?.reflectedOn || ""));
  const worked = done.filter(t => t.verdict === "worked").length;
  const show = done.filter(t => t.verdict === "show").length;

  const section = (title, list, tint) => list.length === 0 ? null : (
    <div key={title} style={{ marginBottom: 18 }}>
      <div style={{ ...S.monthLabel, ...(tint ? { color: tint } : {}) }}>{title} · {list.length}</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {list.map(t => <TrialCard key={t.id} t={t} today={today} updateTrial={updateTrial} removeTrial={removeTrial} setModal={setModal} />)}
      </div>
    </div>
  );

  return (
    <div style={S.page}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <div style={{ ...S.pageTitle, marginBottom: 0 }}>TikTok Try</div>
        <button style={S.primaryBtn} onClick={() => setModal({ type: "addTrial" })}>+ New</button>
      </div>

      {trials.length === 0 ? (
        <div style={S.emptyState}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>🎬</div>
          <div style={S.emptyTitle}>Nothing to try yet</div>
          <div style={S.emptySub}>Add a viral product or trend, set a trial period, track it, and decide if it actually worked or was just for show.</div>
          <button style={{ ...S.primaryBtn, marginTop: 14 }} onClick={() => setModal({ type: "addTrial" })}>Add First Trial</button>
        </div>
      ) : (
        <>
          <div style={S.statsRow}>
            {[["🔬 " + (running.length + due.length), "Trying"], ["✅ " + worked, "Worked"], ["🎭 " + show, "Just for show"]].map(([n, l]) => (
              <div key={l} style={S.statBox}><div style={S.statNum}>{n}</div><div style={S.statLabel}>{l}</div></div>
            ))}
          </div>
          {section("Reflection due", due, NOTE_COLOR)}
          {section("Trying now", running)}
          {section("To try", ideas)}
          {section("Finished", done)}
        </>
      )}
    </div>
  );
}

function TrialCard({ t, today, updateTrial, removeTrial, setModal }) {
  const [open, setOpen] = useState(false);
  const isIdea = t.status === "idea";
  const isDone = t.status === "done";
  const p = isIdea ? null : trialProgress(t, today);
  const inPeriod = p && p.started && today <= t.endDate;
  const obs = [...(t.observations || [])].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  const shownObs = open ? obs : obs.slice(0, 1);
  const verdict = TRIAL_VERDICTS[t.verdict];

  const toggleDay = (d) => updateTrial(t.id, (cur) => ({ checkins: { ...(cur.checkins || {}), [d]: !cur.checkins?.[d] } }));
  const removeObs = (id) => updateTrial(t.id, (cur) => ({ observations: (cur.observations || []).filter(o => o.id !== id) }));
  const remove = () => { if (window.confirm(`Remove "${t.name}" and everything you logged for it?`)) removeTrial(t.id); };

  let badge = null;
  if (isDone && verdict) badge = { text: `${verdict.icon} ${verdict.label}`, color: verdict.color };
  else if (isIdea) badge = { text: "To try", color: "#9a9a8a" };
  else if (!p.started) badge = { text: `Starts in ${daysBetween(today, t.startDate)}d`, color: "#9a9a8a" };
  else if (p.due) badge = { text: "Reflection due", color: NOTE_COLOR };
  else badge = { text: `Day ${p.elapsed}/${t.days}`, color: "#7a9e7e" };

  return (
    <div style={{ ...S.treatCard, ...(!isDone && !isIdea && p.due ? { border: `1.5px solid ${NOTE_COLOR}66` } : {}) }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={S.treatMeta}>{t.type === "trend" ? "✨ Trend" : "🧴 Product"}{t.area ? ` · ${t.area}` : ""}</div>
          <div style={S.treatName}>{t.name}</div>
          {t.brand && <div style={S.brandPreview}>{t.brand}</div>}
          {t.claim && <div style={S.treatNotes}>“{t.claim}”</div>}
          {t.notes && <div style={S.noteReminder}>📌 {t.notes}</div>}
        </div>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 6 }}>
          <span style={{ ...S.statusBadge, background: badge.color + "22", color: badge.color, whiteSpace: "nowrap" }}>{badge.text}</span>
          <button style={S.removeBtn} title="Remove" onClick={remove}>×</button>
        </div>
      </div>

      {isIdea && (
        <button style={{ ...S.primaryBtn, width: "100%", marginTop: 12 }} onClick={() => setModal({ type: "startTrial", id: t.id })}>▶ Start trial</button>
      )}

      {!isIdea && (
        <>
          <div style={{ fontSize: 11, color: "#a09080", marginTop: 8 }}>
            {shortDate(t.startDate)} – {shortDate(t.endDate)} · {t.days} days
          </div>

          {/* Tracker */}
          <div style={S.trialSection}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
              <span style={S.trialLabel}>📊 Tracker</span>
              <span style={{ fontSize: 11, color: "#7a6e5a" }}>{p.checked} of {p.started ? p.elapsed : 0} days used</span>
            </div>
            <ProgressBar value={t.days ? p.elapsed / t.days : 0} color="#7a9e7e" />
            <div style={S.trackGrid}>
              {p.dates.map((d, i) => {
                const on = !!t.checkins?.[d]; const future = d > today; const missed = !on && !future && d < today;
                return (
                  <button key={d} title={shortDate(d)} disabled={future || isDone} onClick={() => toggleDay(d)}
                    style={{ ...S.trackCell, ...(on ? S.trackCellOn : {}), ...(missed ? S.trackCellMissed : {}), ...(d === today ? S.trackCellToday : {}), opacity: future ? 0.35 : 1 }}>
                    {on ? "✓" : i + 1}
                  </button>
                );
              })}
            </div>
            {!isDone && inPeriod && (
              <button style={{ ...S.dashedBtn, marginTop: 10 }} onClick={() => toggleDay(today)}>
                {t.checkins?.[today] ? "✓ Done today — tap to undo" : "✓ Check in today"}
              </button>
            )}
          </div>

          {/* Observations */}
          <div style={S.trialSection}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
              <span style={S.trialLabel}>📝 Observations ({obs.length})</span>
              {!isDone && <button style={S.smallBtn} onClick={() => setModal({ type: "addObservation", id: t.id })}>+ Add</button>}
            </div>
            {obs.length === 0 && <div style={S.emptySmall}>Nothing noted yet</div>}
            {shownObs.map(o => (
              <div key={o.id} style={S.obsRow}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                    <span style={S.obsDate}>{shortDate(o.date)}</span>
                    {o.impression && <span style={S.obsTag}>{o.impression}</span>}
                  </div>
                  {o.text && <div style={S.obsText}>{o.text}</div>}
                </div>
                {!isDone && <button style={S.removeBtn} onClick={() => removeObs(o.id)}>×</button>}
              </div>
            ))}
            {obs.length > 1 && (
              <button style={S.linkBtn} onClick={() => setOpen(o => !o)}>{open ? "Show less" : `Show all ${obs.length}`}</button>
            )}
          </div>

          {/* Reflection */}
          {!isDone && (
            <button style={{ ...(p.due ? S.primaryBtn : S.dashedBtn), width: "100%", marginTop: 10, ...(p.due ? { background: NOTE_COLOR } : {}) }} onClick={() => setModal({ type: "reflection", id: t.id })}>
              {p.due ? "🪞 Reflect & decide" : "🪞 Reflect early"}
            </button>
          )}
          {isDone && (
            <div style={{ ...S.trialSection, background: (verdict?.color || "#7a9e7e") + "12" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                <span style={{ ...S.trialLabel, color: verdict?.color }}>🪞 Reflection · {t.reflection?.reflectedOn ? shortDate(t.reflection.reflectedOn) : ""}</span>
                <button style={S.linkBtn} onClick={() => setModal({ type: "reflection", id: t.id })}>Edit</button>
              </div>
              {t.reflection?.text ? <div style={S.obsText}>{t.reflection.text}</div> : <div style={S.emptySmall}>No written reflection</div>}
            </div>
          )}
        </>
      )}
    </div>
  );
}

function AddTrialModal({ addTrial, close }) {
  const [type, setType] = useState("product");
  const [name, setName] = useState("");
  const [brand, setBrand] = useState("");
  const [claim, setClaim] = useState("");
  const [notes, setNotes] = useState("");
  const [area, setArea] = useState(null);
  const [days, setDays] = useState(14);
  const [startDate, setStartDate] = useState(todayStr());
  const ready = name.trim().length > 0;
  const base = () => ({ type, name: name.trim(), brand: type === "product" ? brand.trim() : "", claim: claim.trim(), notes: notes.trim(), area, createdAt: todayStr() });

  const saveLater = () => { if (!ready) return; addTrial({ ...base(), status: "idea", days: null, startDate: null, endDate: null }); close(); };
  const start = () => {
    if (!ready || !days || !startDate) return;
    addTrial({ ...base(), status: "active", days, startDate, endDate: addDaysStr(startDate, days - 1) });
    close();
  };

  return (
    <Overlay close={close}>
      <div style={S.modalTitle}>🎬 New TikTok Try</div>
      <div style={S.modalSub}>Something you saw and want to test for yourself</div>

      <div style={S.formGroup}>
        <div style={{ display: "flex", gap: 8 }}>
          {[["product", "🧴 Product"], ["trend", "✨ Trend"]].map(([id, label]) => (
            <button key={id} style={{ ...S.filterChip, flex: 1, padding: "8px 0", ...(type === id ? S.filterChipActive : {}) }} onClick={() => setType(id)}>{label}</button>
          ))}
        </div>
      </div>
      <div style={S.formGroup}>
        <label style={S.formLabel}>{type === "product" ? "Product Name" : "Trend Name"}</label>
        <input style={S.formInput} placeholder={type === "product" ? "e.g. Glass Skin Serum" : "e.g. Rice water rinse"} value={name} onChange={e => setName(e.target.value)} autoFocus />
      </div>
      {type === "product" && (
        <div style={S.formGroup}>
          <label style={S.formLabel}>Brand</label>
          <input style={S.formInput} placeholder="e.g. CeraVe" value={brand} onChange={e => setBrand(e.target.value)} />
        </div>
      )}
      <div style={S.formGroup}>
        <label style={S.formLabel}>What it claims</label>
        <textarea style={{ ...S.textarea, height: 58 }} placeholder="What it promises, or where you saw it" value={claim} onChange={e => setClaim(e.target.value)} />
      </div>
      <div style={S.formGroup}>
        <label style={{ ...S.formLabel, color: NOTE_COLOR }}>📌 Important Notes</label>
        <textarea style={{ ...S.textarea, height: 58, borderColor: NOTE_COLOR + "66" }} placeholder="e.g. Patch test first · avoid with retinol" value={notes} onChange={e => setNotes(e.target.value)} />
      </div>
      <div style={S.formGroup}>
        <label style={S.formLabel}>Area (optional)</label>
        <TagPicker tags={TREATMENT_CATEGORIES} value={area} onChange={setArea} color="#7a9e7e" />

      <div style={S.trialSection}>
        <div style={S.formGroup}>
          <label style={S.formLabel}>Trial period</label>
          <LengthPicker days={days} setDays={setDays} />
        </div>
        <div style={{ ...S.formGroup, marginBottom: 0 }}>
          <label style={S.formLabel}>Start date</label>
          <input type="date" style={S.formInput} value={startDate} onChange={e => setStartDate(e.target.value)} />
        </div>
      </div>

      <div style={S.modalBtns}>
        <button style={{ ...S.cancelBtn, opacity: ready ? 1 : 0.5 }} disabled={!ready} onClick={saveLater}>Save for later</button>
        <button style={{ ...S.primaryBtn, flex: 1, opacity: ready && days ? 1 : 0.5 }} disabled={!ready || !days} onClick={start}>▶ Start trial</button>
      </div>
    </Overlay>
  );
}

function ReflectionModal({ trial, updateTrial, close }) {
  const today = todayStr();
  const p = trialProgress(trial, today);
  const [text, setText] = useState(trial.reflection?.text || "");
  const [verdict, setVerdict] = useState(trial.verdict || null);
  const obs = trial.observations || [];
  const counts = TRIAL_IMPRESSIONS.map(t => [t, obs.filter(o => o.impression === t).length]).filter(([, n]) => n > 0);
  const early = !p.due && trial.status !== "done";

  const save = () => {
    if (!verdict) return;
    updateTrial(trial.id, { status: "done", verdict, reflection: { text: text.trim(), reflectedOn: trial.reflection?.reflectedOn || today } });
    close();
  };

  return (
    <Overlay close={close}>
      <div style={S.modalTitle}>🪞 Reflection</div>
      <div style={S.modalSub}>{trial.name}{early ? " · reflecting before the period ends" : ""}</div>

      <div style={S.trackerSection}>
        <div style={S.trackerRow}><span>Period</span><span>{shortDate(trial.startDate)} – {shortDate(trial.endDate)}</span></div>
        <div style={S.trackerRow}><span>Days used</span><span>{p.checked} of {p.started ? p.elapsed : 0}</span></div>
        <div style={{ ...S.trackerRow, borderBottom: "none" }}><span>Observations</span><span>{obs.length}{counts.length ? ` · ${counts.map(([t, n]) => `${n} ${t.split(" ").slice(1).join(" ").toLowerCase()}`).join(", ")}` : ""}</span></div>
      </div>
      {trial.claim && <div style={{ ...S.treatNotes, marginBottom: 12 }}>It claimed: “{trial.claim}”</div>}

      <div style={S.formGroup}>
        <label style={S.formLabel}>How did it go?</label>
        <textarea style={{ ...S.textarea, height: 110 }} placeholder="Did it deliver on what it promised? What changed? Would you do it again?" value={text} onChange={e => setText(e.target.value)} />
      </div>

      <div style={S.formGroup}>
        <label style={S.formLabel}>Your verdict</label>
        <div style={{ display: "flex", gap: 8 }}>
          {Object.entries(TRIAL_VERDICTS).map(([id, v]) => {
            const active = verdict === id;
            return (
              <button key={id} style={{ ...S.verdictBtn, ...(active ? { background: v.color, borderColor: v.color, color: "#fff" } : { color: v.color, borderColor: v.color + "66" }) }} onClick={() => setVerdict(id)}>
                <span style={{ fontSize: 20 }}>{v.icon}</span>
                <span>{v.label}</span>
              </button>
            );
          })}
        </div>
      </div>

      <div style={S.modalBtns}>
        <button style={S.cancelBtn} onClick={close}>Cancel</button>
        <button style={{ ...S.primaryBtn, flex: 1, opacity: verdict ? 1 : 0.5 }} disabled={!verdict} onClick={save}>{trial.status === "done" ? "Save changes" : "Finish trial"}</button>
      </div>
    </Overlay>
  );
}

function UVCard({ uvData, uvLoading, requestLocation }) {
  if (uvLoading) return (
    <div style={{ ...S.card, ...S.uvCard }}>
      <div style={S.uvLoading}>☀️ Fetching UV index...</div>
    </div>
  );

  if (!uvData) return (
    <div style={{ ...S.card, ...S.uvCardNeutral }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div>
          <div style={S.cardTitle}>☀️ UV Index</div>
          <div style={S.uvNoDataText}>Enable location for today's UV forecast & SPF recommendation</div>
        </div>
        <button style={S.uvLocationBtn} onClick={requestLocation}>Enable</button>
      </div>
    </div>
  );

  if (uvData.uv === null) return (
    <div style={{ ...S.card, ...S.uvCardNeutral }}>
      <div style={S.cardTitle}>☀️ UV Index</div>
      <div style={S.uvNoDataText}>UV data unavailable — apply SPF 30 as a safe default.</div>
    </div>
  );

  const lvl = getUVLevel(uvData.uv);
  return (
    <div style={{ ...S.card, background: lvl.color + "15", borderLeft: `4px solid ${lvl.color}`, paddingLeft: 12 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div style={{ flex: 1 }}>
          <div style={{ ...S.cardTitle, color: lvl.color }}>☀️ UV Index — {lvl.label}</div>
          <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginBottom: 6 }}>
            <span style={{ fontSize: 36, fontWeight: "700", color: lvl.color, fontStyle: "italic", lineHeight: 1 }}>{uvData.uv}</span>

          </div>
          <div style={S.uvRec}>{lvl.rec}</div>
          <div style={S.uvDetail}>{lvl.detail}</div>
        </div>
        <div style={{ fontSize: 32, marginLeft: 10, opacity: 0.85 }}>{lvl.emoji}</div>
      </div>
      <UVBar value={uvData.uv} />
    </div>
  );
}

function UVBar({ value }) {
  const pct = Math.min(value / 11, 1) * 100;
  const segments = [
    { label: "Low", color: "#7a9e7e", width: 18 },
    { label: "Mod", color: "#c4a86a", width: 27 },
    { label: "High", color: "#d4946a", width: 27 },
    { label: "V.High", color: "#c4604a", width: 18 },
    { label: "Ext", color: "#8a3a6a", width: 10 },
  ];
  return (
    <div style={{ marginTop: 10 }}>
      <div style={{ display: "flex", height: 7, borderRadius: 6, overflow: "hidden", gap: 1 }}>
        {segments.map(s => <div key={s.label} style={{ width: `${s.width}%`, background: s.color, opacity: 0.6 }} />)}
      </div>
      <div style={{ position: "relative", height: 14 }}>
        <div style={{ position: "absolute", left: `${Math.min(pct, 96)}%`, top: 2, transform: "translateX(-50%)" }}>
          <div style={{ width: 8, height: 8, borderRadius: "50%", background: "#3a4a3a", border: "2px solid #faf7f2" }} />
        </div>
      </div>
    </div>
  );
}
