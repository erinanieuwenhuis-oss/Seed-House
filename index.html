// ─── Today Page ───────────────────────────────────────────────
function TodayPage({ selDate, getLog, updLog, toggleStep, products, newProd, setNewProd, addingProd, setAddingProd, addProduct, removeProd, completionRate, saved, ingredients, productMeta, photos, addPhoto, setModal, uvData, uvLoading, requestLocation, productData, setProductData, stockAlerts, stockItems }) {
  const log = getLog(selDate);
  const rate = completionRate(selDate);
  const fmt = fmtDate(selDate);
  const isToday = selDate === todayStr();
  const dayPhotos = photos[selDate] || [];

  // Notes & observations are drafted locally and only committed to the day's log
  // via the explicit Save button below — this is what a future progress report will read from.
  const [draftCondition, setDraftCondition] = useState(log.condition || null);
  const [draftMood, setDraftMood] = useState(log.mood || null);
  const [draftNotes, setDraftNotes] = useState(log.notes || "");
  const [justSaved, setJustSaved] = useState(false);

  useEffect(() => {
    setDraftCondition(log.condition || null);
    setDraftMood(log.mood || null);
    setDraftNotes(log.notes || "");
    setJustSaved(false);
  }, [selDate]);

  const savedCondition = log.condition || null;
  const savedMood = log.mood || null;
  const savedNotes = log.notes || "";
  const hasUnsaved = draftCondition !== savedCondition || draftMood !== savedMood || draftNotes !== savedNotes;

  const saveObservations = () => {
    updLog(selDate, { condition: draftCondition, mood: draftMood, notes: draftNotes, observationsSavedAt: new Date().toISOString() });
    setJustSaved(true);
    setTimeout(() => setJustSaved(false), 1800);
  };

  return (
    <div style={S.page}>
      <div style={S.dateRow}>
        <div>
          <div style={S.dateDay}>{isToday ? "Today" : fmt.short}</div>
          <div style={S.dateText}>{fmt.month} {fmt.date}, {fmt.year}</div>
        </div>
        {saved && <span style={S.savedBadge}>saved ✓</span>}
        <RingProgress value={rate} />
      </div>

      {/* UV Card */}
      {isToday && <UVCard uvData={uvData} uvLoading={uvLoading} requestLocation={requestLocation} />}

      {/* Stock Alerts */}
      <StockAlertBanner alerts={stockAlerts} setModal={setModal} productData={productData} setProductData={setProductData} />

      <RoutineBlock period="morning" label="🌅 Morning" products={products.morning} log={log} toggleStep={toggleStep} selDate={selDate} newProd={newProd} setNewProd={setNewProd} addingProd={addingProd} setAddingProd={setAddingProd} addProduct={addProduct} removeProd={removeProd} ingredients={ingredients} productMeta={productMeta} productData={productData} setModal={setModal} stockItems={stockItems} />
      <RoutineBlock period="evening" label="🌙 Evening" products={products.evening} log={log} toggleStep={toggleStep} selDate={selDate} newProd={newProd} setNewProd={setNewProd} addingProd={addingProd} setAddingProd={setAddingProd} addProduct={addProduct} removeProd={removeProd} ingredients={ingredients} productMeta={productMeta} productData={productData} setModal={setModal} stockItems={stockItems} />

      <div style={S.card}>
        <div style={S.cardTitle}>🪞 Skin Condition</div>
        <TagPicker tags={SKIN_CONDITIONS} value={draftCondition} onChange={v => setDraftCondition(v)} color="#7a9e7e" />
      </div>
      <div style={S.card}>
        <div style={S.cardTitle}>💭 Mood</div>
        <TagPicker tags={MOODS} value={draftMood} onChange={v => setDraftMood(v)} color="#c4a86a" />
      </div>
      <div style={S.card}>
        <div style={S.cardTitle}>📝 Notes</div>
        <textarea style={S.textarea} placeholder="How did your skin feel today? Any reactions or observations..." value={draftNotes} onChange={e => setDraftNotes(e.target.value)} rows={3} />
      </div>
      <div style={S.card}>
        <div style={{ ...S.cardTitle, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span>📷 Today's Photos</span>
          <button style={S.smallBtn} onClick={() => setModal({ type: "addPhoto", date: selDate })}>+ Add</button>
        </div>
        {dayPhotos.length === 0 ? (
          <div style={S.emptySmall}>No photos yet — capture your skin today!</div>
        ) : (
          <div style={S.photoStrip}>
            {dayPhotos.map(ph => (
              <div key={ph.id} style={S.photoThumb} onClick={() => setModal({ type: "photoView", photo: ph, date: selDate })}>
                <img src={ph.data} alt="" style={S.photoThumbImg} />
                {ph.tag && <span style={S.photoTag}>{ph.tag}</span>}
              </div>
            ))}
          </div>
        )}
      </div>

      <div style={S.card}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
          <div style={S.cardTitle}>💾 Save Progress</div>
          {!hasUnsaved && log.observationsSavedAt && (
            <span style={{ fontSize: 11, color: "#7a9e7e" }}>
              Saved {new Date(log.observationsSavedAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}
            </span>
          )}
        </div>
        {hasUnsaved ? (
          <div style={{ fontSize: 12, color: "#c4a86a", marginBottom: 10 }}>You have unsaved notes and observations for this day.</div>
        ) : (
          <div style={{ fontSize: 12, color: "#9a8e7a", marginBottom: 10 }}>{log.observationsSavedAt ? "Everything's saved." : "Add a skin condition, mood, or note above, then save it here."}</div>
        )}
        <button style={{ ...S.primaryBtn, width: "100%", opacity: hasUnsaved ? 1 : 0.55, cursor: hasUnsaved ? "pointer" : "default" }} onClick={saveObservations} disabled={!hasUnsaved}>
          {justSaved ? "✓ Saved" : "💾 Save Notes & Observations"}
        </button>
        <div style={{ fontSize: 11, color: "#9a8e7a", marginTop: 8, lineHeight: 1.5 }}>Saved observations are what future progress reports will be built from.</div>
      </div>
    </div>
  );
}

// ─── Routine Block ────────────────────────────────────────────
function RoutineBlock({ period, label, products, log, toggleStep, selDate, newProd, setNewProd, addingProd, setAddingProd, addProduct, removeProd, ingredients, productMeta, productData, setModal, stockItems }) {
  const periodLog = log[period] || {};
  const done = products.filter(s => periodLog[s]).length;
  const color = period === "morning" ? "#c4a86a" : "#7a9e7e";

  return (
    <div style={S.card}>
      <div style={S.routineHeader}>
        <span style={S.cardTitle}>{label}</span>
        <span style={{ ...S.badge, background: color + "22", color }}>{done}/{products.length}</span>
      </div>
      <ProgressBar value={products.length ? done / products.length : 0} color={color} />
      <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 8 }}>
        {products.map((step, idx) => {
          const pd = productData[step];
          const stockStatus = getStockStatus(pd);
          const isCalibrating = pd?.calibrating;
          const hasIngr = ingredients[step]?.length > 0;
          const meta = productMeta[step];
          const isLow = stockStatus && stockStatus.daysLeft <= 7;
          const isSPF = step.toLowerCase().includes("spf") || step.toLowerCase().includes("sunscreen");

          return (
            <div key={step}>
              <div style={S.stepRow}>
                <button style={{ ...S.checkbox, ...(periodLog[step] ? { background: color, borderColor: color } : {}) }} onClick={() => toggleStep(selDate, period, step)}>
                  {periodLog[step] && <span style={S.checkmark}>✓</span>}
                </button>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                    <span style={{ ...S.stepName, textDecoration: periodLog[step] ? "line-through" : "none", opacity: periodLog[step] ? 0.45 : 1 }}>{step}</span>
                    {isLow && <span style={S.lowBadge}>low</span>}
                    {isCalibrating && <span style={S.calBadge}>calibrating</span>}
                  </div>
                  {meta?.brand && <div style={S.brandPreview}>{meta.brand}</div>}
                  {meta?.notes && <div style={{ ...S.noteReminder, opacity: periodLog[step] ? 0.55 : 1 }}>📌 {meta.notes}</div>}
                  {hasIngr && <div style={S.ingrPreview}>{ingredients[step].slice(0, 3).join(" · ")}{ingredients[step].length > 3 ? ` +${ingredients[step].length - 3}` : ""}</div>}
                  {stockStatus && !isLow && <div style={S.stockPreview}>~{stockStatus.daysLeft}d left</div>}
                  {meta?.price && <div style={S.pricePreview}>💰 {meta.price}</div>}
                  {meta?.incompatible?.length > 0 && <div style={S.incompPreview}>⚠ avoid with {meta.incompatible.slice(0, 2).join(", ")}{meta.incompatible.length > 2 ? ` +${meta.incompatible.length - 2}` : ""}</div>}
                </div>
                <button style={S.iconBtn} title="Product details" onClick={() => setModal({ type: "productDetails", product: step, scope: "facial", period })}>🧪</button>
                <button style={S.iconBtn} title="Product tracker" onClick={() => setModal({ type: "productTracker", product: step, productData })}>📦</button>

                <button style={S.removeBtn} onClick={() => removeProd(period, idx)}>×</button>
              </div>
            </div>
          );
        })}
      </div>
      {addingProd === period ? (
        <ProductPicker available={(stockItems || []).filter(n => !products.includes(n))} productMeta={productMeta} onPick={(n) => addProduct(period, n)} onAddNew={(n) => { addProduct(period, n); setAddingProd(null); }} onClose={() => setAddingProd(null)} />
      ) : (
        <button style={S.dashedBtn} onClick={() => setAddingProd(period)}>+ Add product</button>
      )}
    </div>
  );
}

// ─── Calendar Page ─────────────────────────────────────────────
function CalendarPage({ selDate, setSelDate, calMonth, setCalMonth, hasLog, completionRate, photos, setTab }) {
  const { y, m } = calMonth;
  const daysInMonth = getDaysInMonth(y, m);
  const firstDay = getFirstDay(y, m);
  const cells = [...Array(firstDay).fill(null), ...Array.from({ length: daysInMonth }, (_, i) => i + 1)];
  const today = todayStr();
  return (
    <div style={S.page}>
      <div style={S.card}>
        <div style={S.calNav}>
          <button style={S.calNavBtn} onClick={() => setCalMonth(p => { const nm = p.m === 0 ? 11 : p.m - 1; return { y: nm === 11 ? p.y - 1 : p.y, m: nm }; })}>‹</button>
          <span style={S.calTitle}>{MONTHS[m]} {y}</span>
          <button style={S.calNavBtn} onClick={() => setCalMonth(p => { const nm = p.m === 11 ? 0 : p.m + 1; return { y: nm === 0 ? p.y + 1 : p.y, m: nm }; })}>›</button>
        </div>
        <div style={S.calGrid}>
          {DAYS_SHORT.map(d => <div key={d} style={S.calDayLabel}>{d}</div>)}
          {cells.map((d, i) => {
            if (!d) return <div key={`e${i}`} />;
            const ds = `${y}-${String(m + 1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
            const isToday = ds === today; const isSel = ds === selDate;
            const rate = completionRate(ds); const logged = hasLog(ds);
            const hasPhoto = (photos[ds] || []).length > 0;
            return (
              <div key={d} style={{ ...S.calDay, ...(isToday ? S.calToday : {}), ...(isSel ? S.calSelected : {}) }}
                onClick={() => { setSelDate(ds); setTab("today"); }}>
                <span style={S.calDayNum}>{d}</span>
                {logged && <div style={{ ...S.calDot, background: rate > 66 ? "#7a9e7e" : rate > 33 ? "#c4a86a" : "#d4846a" }} />}
                {hasPhoto && <div style={S.calPhotoDot}>📷</div>}
              </div>
            );
          })}
        </div>
        <div style={S.legend}>
          {[["#7a9e7e","Full"],["#c4a86a","Partial"],["#d4846a","Started"]].map(([c,l]) => (
            <span key={l} style={S.legendItem}><span style={{ ...S.legendDot, background: c }} />{l}</span>
          ))}
          <span style={S.legendItem}><span style={S.legendDot}>📷</span> Photo</span>
        </div>
      </div>
    </div>
  );
}

// ─── Photo Log Page ───────────────────────────────────────────
function PhotoLogPage({ photos, setModal, addPhoto, removePhoto, selDate }) {
  const fileRef = useRef();
  const [filterTag, setFilterTag] = useState("All");
  const allEntries = Object.entries(photos).flatMap(([date, arr]) => arr.map(ph => ({ ...ph, date }))).filter(ph => filterTag === "All" || ph.tag === filterTag).sort((a, b) => b.date.localeCompare(a.date));
  const handleFile = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => setModal({ type: "addPhoto", date: selDate, preloaded: ev.target.result });
    reader.readAsDataURL(file); e.target.value = "";
  };
  const grouped = allEntries.reduce((acc, ph) => {
    const d = new Date(ph.date + "T12:00:00"); const key = `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
    if (!acc[key]) acc[key] = []; acc[key].push(ph); return acc;
  }, {});
  return (
    <div style={S.page}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <div style={S.pageTitle}>Photo Journal</div>
        <div><input type="file" accept="image/*" style={{ display: "none" }} ref={fileRef} onChange={handleFile} /><button style={S.primaryBtn} onClick={() => fileRef.current.click()}>+ Photo</button></div>
      </div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 14 }}>
        {["All", ...PHOTO_TAGS].map(t => <button key={t} style={{ ...S.filterChip, ...(filterTag === t ? S.filterChipActive : {}) }} onClick={() => setFilterTag(t)}>{t}</button>)}
      </div>
      {allEntries.length === 0 ? (
        <div style={S.emptyState}><div style={{ fontSize: 40, marginBottom: 12 }}>📷</div><div style={S.emptyTitle}>No photos yet</div><div style={S.emptySub}>Capture your skin journey</div><button style={{ ...S.primaryBtn, marginTop: 14 }} onClick={() => fileRef.current.click()}>Add First Photo</button></div>
      ) : Object.entries(grouped).map(([month, phs]) => (
        <div key={month} style={{ marginBottom: 22 }}>
          <div style={S.monthLabel}>{month}</div>
          <div style={S.photoGrid}>
            {phs.map(ph => (
              <div key={ph.id} style={S.photoCard} onClick={() => setModal({ type: "photoView", photo: ph, date: ph.date })}>
                <img src={ph.data} alt="" style={S.photoCardImg} />
                <div style={S.photoCardFooter}>{ph.tag && <span style={S.photoTagChip}>{ph.tag}</span>}<span style={S.photoDate}>{fmtDate(ph.date).month.slice(0,3)} {fmtDate(ph.date).date}</span></div>
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

// ─── Treatments Page ──────────────────────────────────────────
function TreatmentsPage({ treatments, addTreatment, logTreatment, removeTreatment, setModal }) {
  const today = todayStr();
  const getDueStatus = (t) => {
    if (!t.lastDone) return "due";
    const freqDays = { "Weekly":7,"Bi-weekly":14,"Monthly":30,"Every 6 weeks":42,"Every 3 months":90,"As needed":null };
    const days = freqDays[t.frequency]; if (!days) return "as-needed";
    const diff = Math.ceil((new Date(t.lastDone + "T12:00:00").setDate(new Date(t.lastDone + "T12:00:00").getDate() + days) - new Date()) / 86400000);
    if (diff <= 0) return "overdue"; if (diff <= 3) return "soon"; return "ok";
  };
  const statusLabel = { "due":"Due now","overdue":"Overdue","soon":"Due soon","ok":"Scheduled","as-needed":"As needed" };
  const statusColor = { "due":"#c4a86a","overdue":"#d4846a","soon":"#e8b86a","ok":"#7a9e7e","as-needed":"#9a9a8a" };
  const upcoming = [...treatments].sort((a, b) => ({ overdue:0,due:1,soon:2,"as-needed":3,ok:4 }[getDueStatus(a)] - { overdue:0,due:1,soon:2,"as-needed":3,ok:4 }[getDueStatus(b)]));
  return (
    <div style={S.page}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
        <div style={S.pageTitle}>Treatments</div>
        <button style={S.primaryBtn} onClick={() => setModal({ type: "addTreatment" })}>+ New</button>
      </div>
      {treatments.length === 0 ? (
        <div style={S.emptyState}><div style={{ fontSize:40, marginBottom:12 }}>💆</div><div style={S.emptyTitle}>No treatments yet</div><div style={S.emptySub}>Track facials, peels, Botox, waxing, lash fills — anything non-daily</div><button style={{ ...S.primaryBtn, marginTop:14 }} onClick={() => setModal({ type:"addTreatment" })}>Add Treatment</button></div>
      ) : (
        <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
          {upcoming.map(t => {
            const status = getDueStatus(t); const color = statusColor[status];
            return (
              <div key={t.id} style={S.treatCard}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
                  <div style={{ flex:1 }}>
                    <div style={S.treatName}>{t.name}</div>
                    <div style={S.treatMeta}>{t.category} · {t.frequency}</div>
                    {t.notes && <div style={S.treatNotes}>{t.notes}</div>}
                    <div style={S.treatHistory}>{t.lastDone ? `Last: ${fmtDate(t.lastDone).month.slice(0,3)} ${fmtDate(t.lastDone).date}` : "Never done"}{t.history?.length > 1 ? ` · ${t.history.length} sessions` : ""}</div>
                  </div>
                  <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-end", gap:6 }}>
                    <span style={{ ...S.statusBadge, background:color+"22", color }}>{statusLabel[status]}</span>
                    <button style={S.removeBtn} onClick={() => removeTreatment(t.id)}>×</button>
                  </div>
                </div>
                <button style={{ ...S.dashedBtn, marginTop:10 }} onClick={() => logTreatment(t.id, today)}>✓ Mark done today</button>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ─── Insights Page ────────────────────────────────────────────
function InsightsPage({ logs, products, streak, completionRate, hasLog, ingredients, treatments, productData, setSelDate, setTab }) {
  const today = new Date();
  const last7 = Array.from({ length:7 }, (_, i) => { const d = new Date(today); d.setDate(d.getDate()-i); return d.toISOString().split("T")[0]; }).reverse();
  const last30 = Array.from({ length:30 }, (_, i) => { const d = new Date(today); d.setDate(d.getDate()-i); return d.toISOString().split("T")[0]; });
  const avgCompletion = Math.round(last30.filter(hasLog).reduce((a, d) => a + completionRate(d), 0) / Math.max(1, last30.filter(hasLog).length));
  const topConditions = SKIN_CONDITIONS.map(c => ({ label:c, count:Object.values(logs).filter(l => l.condition===c).length })).filter(x => x.count>0).sort((a,b)=>b.count-a.count).slice(0,4);
  const totalIngr = Object.values(ingredients).flat();
  const ingrFreq = totalIngr.reduce((a,v) => { a[v]=(a[v]||0)+1; return a; }, {});

  return (

      </div>

        <div style={S.cardTitle}>Last 7 Days</div>
        <div style={S.weekGrid}>
          {last7.map(d => {

                <div style={S.weekLabel}>{DAYS_SHORT[dt.getDay()]}</div>

        {allProducts.map(name => {

          const stockStatus = getStockStatus(pd);
          const isCalibrating = pd.calibrating;

          const today2 = todayStr();
          const daysPassed = calStart ? Math.ceil((new Date(today2+"T12:00:00") - new Date(calStart+"T12:00:00")) / 86400000) : 0;
          const calPct = Math.min(100, Math.round((daysPassed / (pd.calibrationDays||30)) * 100));

          return (

                    <div style={{ height:4, background:"#f0ebe2", borderRadius:4, overflow:"hidden", marginTop:4 }}>
                      <div style={{ height:"100%", background:"#c4a86a", width:`${calPct}%`, borderRadius:4, transition:"width 0.4s" }} />

// ─── Progress Report (weekly / monthly) ─────────────────────────
function ReportPage({ logs, photos, treatments, completionRate, hasLog, setSelDate, setTab }) {
  const [mode, setMode] = useState("weekly");
  const [offset, setOffset] = useState(0);
  const today = todayStr();

  let rangeStart, rangeEnd, rangeLabel, gridDates;

  if (mode === "weekly") {
    const base = new Date(today + "T12:00:00");
    base.setDate(base.getDate() - offset * 7);
    const day = base.getDay();
    const start = new Date(base); start.setDate(start.getDate() - day);
    const end = new Date(start); end.setDate(end.getDate() + 6);
    rangeStart = start.toISOString().split("T")[0];
    rangeEnd = end.toISOString().split("T")[0];
    rangeLabel = `${fmtDate(rangeStart).month.slice(0, 3)} ${fmtDate(rangeStart).date} – ${fmtDate(rangeEnd).month.slice(0, 3)} ${fmtDate(rangeEnd).date}, ${fmtDate(rangeEnd).year}`;
    gridDates = Array.from({ length: 7 }, (_, i) => { const d = new Date(start); d.setDate(d.getDate() + i); return d.toISOString().split("T")[0]; });
  } else {
    const base = new Date(today + "T12:00:00");
    let y = base.getFullYear(), m = base.getMonth() - offset;
    while (m < 0) { m += 12; y -= 1; }
    const daysInMonth = getDaysInMonth(y, m);
    rangeStart = `${y}-${String(m + 1).padStart(2, "0")}-01`;
    rangeEnd = `${y}-${String(m + 1).padStart(2, "0")}-${String(daysInMonth).padStart(2, "0")}`;
    rangeLabel = `${MONTHS[m]} ${y}`;
    gridDates = Array.from({ length: daysInMonth }, (_, i) => `${y}-${String(m + 1).padStart(2, "0")}-${String(i + 1).padStart(2, "0")}`);
  }

  const datesInRange = gridDates.filter(d => d <= today);
  const loggedDates = datesInRange.filter(hasLog);
  const avgCompletion = loggedDates.length ? Math.round(loggedDates.reduce((a, d) => a + completionRate(d), 0) / loggedDates.length) : 0;

  const conditionCounts = {};
  const moodCounts = {};
  const notesEntries = [];
  loggedDates.forEach(d => {
    const l = logs[d];
    if (!l) return;
    if (l.condition) conditionCounts[l.condition] = (conditionCounts[l.condition] || 0) + 1;
    if (l.mood) moodCounts[l.mood] = (moodCounts[l.mood] || 0) + 1;
    if (l.notes) notesEntries.push({ date: d, condition: l.condition, mood: l.mood, notes: l.notes });
  });
  notesEntries.sort((a, b) => b.date.localeCompare(a.date));
  const topConditions = Object.entries(conditionCounts).sort((a, b) => b[1] - a[1]);
  const topMoods = Object.entries(moodCounts).sort((a, b) => b[1] - a[1]);
  const maxCount = Math.max(1, ...topConditions.map(([, c]) => c), ...topMoods.map(([, c]) => c));

  const photosInRange = datesInRange.flatMap(d => (photos[d] || []).map(p => ({ ...p, date: d }))).sort((a, b) => a.date.localeCompare(b.date));
  const firstPhoto = photosInRange[0];
  const lastPhoto = photosInRange[photosInRange.length - 1];

  const treatmentsInRange = treatments.filter(t => (t.history || []).some(d => d >= rangeStart && d <= rangeEnd));

  const [exporting, setExporting] = useState(false);

  const imgFormat = (url) => {
    const m = /^data:image\/(png|jpe?g|webp)/i.exec(url || "");
    if (!m) return "JPEG";
    const t = m[1].toLowerCase();
    return t === "png" ? "PNG" : t === "webp" ? "WEBP" : "JPEG";
  };

  const exportPDF = () => {
    if (!window.jspdf) { alert("PDF export isn't ready yet — please try again in a moment."); return; }
    setExporting(true);
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: "pt", format: "a4" });
      const pageWidth = doc.internal.pageSize.getWidth();
      const pageHeight = doc.internal.pageSize.getHeight();
      const margin = 40;
      let y = 54;

      const checkPage = (needed) => {
        if (y + needed > pageHeight - 40) { doc.addPage(); y = 54; }
      };

      doc.setFont("helvetica", "bold"); doc.setFontSize(20); doc.setTextColor(58, 74, 58);
      doc.text("glōw — Skin Progress Report", margin, y); y += 24;
      doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(122, 110, 90);
      doc.text(`${mode === "weekly" ? "Weekly" : "Monthly"} · ${rangeLabel}`, margin, y); y += 15;
      doc.text(`Generated ${fmtDate(today).month} ${fmtDate(today).date}, ${fmtDate(today).year}`, margin, y); y += 26;

      doc.setTextColor(58, 74, 58); doc.setFont("helvetica", "bold"); doc.setFontSize(13);
      doc.text("Summary", margin, y); y += 18;
      doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(70, 65, 55);
      doc.text(`Avg completion: ${avgCompletion}%`, margin, y); y += 16;
      doc.text(`Days logged: ${loggedDates.length}/${datesInRange.length}`, margin, y); y += 16;
      doc.text(`Photos taken: ${photosInRange.length}`, margin, y); y += 26;

      if (topConditions.length) {
        checkPage(20 + topConditions.length * 16);
        doc.setTextColor(58, 74, 58); doc.setFont("helvetica", "bold"); doc.setFontSize(13);
        doc.text("Skin Condition", margin, y); y += 18;
        doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(70, 65, 55);
        topConditions.forEach(([label, count]) => { doc.text(`${label} — ${count}x`, margin, y); y += 16; });
        y += 10;
      }

      if (topMoods.length) {
        checkPage(20 + topMoods.length * 16);
        doc.setTextColor(58, 74, 58); doc.setFont("helvetica", "bold"); doc.setFontSize(13);
        doc.text("Mood", margin, y); y += 18;
        doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(70, 65, 55);
        topMoods.forEach(([label, count]) => { doc.text(`${label} — ${count}x`, margin, y); y += 16; });
        y += 10;
      }

      if (treatmentsInRange.length) {
        checkPage(20 + treatmentsInRange.length * 16);
        doc.setTextColor(58, 74, 58); doc.setFont("helvetica", "bold"); doc.setFontSize(13);
        doc.text("Treatments This Period", margin, y); y += 18;
        doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(70, 65, 55);
        treatmentsInRange.forEach(t => {
          const doneInRange = (t.history || []).filter(d => d >= rangeStart && d <= rangeEnd);
          doc.text(`${t.name} — ${doneInRange.length}x`, margin, y); y += 16;
        });
        y += 10;
      }

      if (firstPhoto) {
        checkPage(190);
        doc.setTextColor(58, 74, 58); doc.setFont("helvetica", "bold"); doc.setFontSize(13);
        doc.text("Photo Comparison", margin, y); y += 16;
        const imgW = 140, imgH = 140;
        try {
          doc.addImage(firstPhoto.data, imgFormat(firstPhoto.data), margin, y, imgW, imgH);
          doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(122, 110, 90);
          doc.text(`Start — ${fmtDate(firstPhoto.date).month.slice(0, 3)} ${fmtDate(firstPhoto.date).date}`, margin, y + imgH + 12);
          if (lastPhoto && lastPhoto.id !== firstPhoto.id) {
            doc.addImage(lastPhoto.data, imgFormat(lastPhoto.data), margin + imgW + 20, y, imgW, imgH);
            doc.text(`End — ${fmtDate(lastPhoto.date).month.slice(0, 3)} ${fmtDate(lastPhoto.date).date}`, margin + imgW + 20, y + imgH + 12);
          }
        } catch (e) {}
        y += imgH + 34;
      }

      if (notesEntries.length) {
        checkPage(30);
        doc.setTextColor(58, 74, 58); doc.setFont("helvetica", "bold"); doc.setFontSize(13);
        doc.text("Observations Timeline", margin, y); y += 18;
        notesEntries.forEach(e => {
          const header = `${fmtDate(e.date).month.slice(0, 3)} ${fmtDate(e.date).date}${(e.condition || e.mood) ? " — " + [e.condition, e.mood].filter(Boolean).join(" · ") : ""}`;
          const lines = doc.splitTextToSize(e.notes, pageWidth - margin * 2);
          checkPage(16 + lines.length * 13);
          doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(58, 74, 58);
          doc.text(header, margin, y); y += 14;
          doc.setFont("helvetica", "normal"); doc.setTextColor(70, 65, 55);
          lines.forEach(line => { doc.text(line, margin, y); y += 13; });
          y += 6;
        });
      }

      doc.save(`glow-report-${rangeStart}-to-${rangeEnd}.pdf`);
    } catch (err) {
      console.error(err);
      alert("Something went wrong generating the PDF.");
    }
    setExporting(false);
  };

  return (
    <div style={S.page}>
      <div style={S.pageTitle}>Progress Report</div>

      {/* Mode + navigation */}
      <div style={S.card}>
        <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
          {["weekly", "monthly"].map(m => (
            <button key={m} style={{ ...S.filterChip, flex: 1, textAlign: "center", ...(mode === m ? S.filterChipActive : {}) }} onClick={() => { setMode(m); setOffset(0); }}>{m === "weekly" ? "Weekly" : "Monthly"}</button>
          ))}
        </div>
        <div style={S.calNav}>
          <button style={S.calNavBtn} onClick={() => setOffset(o => o + 1)}>‹</button>
          <span style={S.calTitle}>{rangeLabel}</span>
          <button style={{ ...S.calNavBtn, opacity: offset === 0 ? 0.3 : 1 }} onClick={() => setOffset(o => Math.max(0, o - 1))} disabled={offset === 0}>›</button>
        </div>
        {offset > 0 && <button style={{ ...S.dashedBtn, marginTop: 8 }} onClick={() => setOffset(0)}>Jump to {mode === "weekly" ? "this week" : "this month"}</button>}
        <button style={{ ...S.primaryBtn, width: "100%", marginTop: 10, opacity: exporting ? 0.6 : 1 }} onClick={exportPDF} disabled={exporting}>{exporting ? "Preparing…" : "📄 Export PDF"}</button>
      </div>

      {/* Summary stats */}
      <div style={S.statsRow}>
        <div style={S.statBox}><div style={S.statNum}>{avgCompletion}%</div><div style={S.statLabel}>Avg Completion</div></div>
        <div style={S.statBox}><div style={S.statNum}>{loggedDates.length}/{datesInRange.length}</div><div style={S.statLabel}>Days Logged</div></div>
        <div style={S.statBox}><div style={S.statNum}>{photosInRange.length}</div><div style={S.statLabel}>Photos</div></div>
      </div>

      {/* Completion trend */}
      <div style={S.card}>
        <div style={S.cardTitle}>Routine Completion</div>
        {mode === "weekly" ? (
          <div style={S.weekGrid}>
            {gridDates.map(d => {
              const rate = completionRate(d); const logged = hasLog(d); const dt = new Date(d + "T12:00:00"); const isFuture = d > today;
              return (
                <div key={d} style={S.weekCol} onClick={() => { if (!isFuture) { setSelDate(d); setTab("today"); } }}>
                  <div style={S.weekPct}>{!isFuture && logged ? rate + "%" : ""}</div>
                  <div style={S.weekBarWrap}><div style={{ ...S.weekBar, height: `${!isFuture && logged ? Math.max(rate, 6) : 6}%`, background: isFuture ? "#f0ebe2" : (rate > 66 ? "#7a9e7e" : rate > 33 ? "#c4a86a" : logged ? "#d4846a" : "#e0d8cc") }} /></div>
                  <div style={S.weekLabel}>{DAYS_SHORT[dt.getDay()]}</div>
                </div>
              );
            })}
          </div>
        ) : (
          <div style={S.calGrid}>
            {(() => {
              const y = Number(rangeStart.slice(0, 4)), m = Number(rangeStart.slice(5, 7)) - 1;
              const firstDay = getFirstDay(y, m);
              const cells = [...Array(firstDay).fill(null), ...gridDates];
              return (
                <>
                  {DAYS_SHORT.map(d => <div key={d} style={S.calDayLabel}>{d}</div>)}
                  {cells.map((d, i) => {
                    if (!d) return <div key={`e${i}`} />;
                    const isFuture = d > today;
                    const rate = completionRate(d); const logged = hasLog(d);
                    return (
                      <div key={d} style={{ ...S.calDay, cursor: isFuture ? "default" : "pointer" }} onClick={() => { if (!isFuture) { setSelDate(d); setTab("today"); } }}>
                        <span style={S.calDayNum}>{Number(d.slice(8, 10))}</span>
                        {!isFuture && logged && <div style={{ ...S.calDot, background: rate > 66 ? "#7a9e7e" : rate > 33 ? "#c4a86a" : "#d4846a" }} />}
                      </div>
                    );
                  })}
                </>
              );
            })()}
          </div>
        )}
      </div>

      {/* Skin condition breakdown */}
      {topConditions.length > 0 && (
        <div style={S.card}>
          <div style={S.cardTitle}>Skin Condition</div>
          {topConditions.map(([label, count]) => (
            <div key={label} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
              <span style={{ fontSize: 13, color: "#4a5c4a", minWidth: 110 }}>{label}</span>
              <div style={{ flex: 1, height: 8, background: "#f0ebe2", borderRadius: 4, overflow: "hidden" }}><div style={{ height: "100%", background: "#7a9e7e", borderRadius: 4, width: `${(count / maxCount) * 100}%` }} /></div>
              <span style={{ fontSize: 12, color: "#7a6e5a", minWidth: 20 }}>{count}x</span>
            </div>
          ))}
        </div>
      )}

      {/* Mood breakdown */}
      {topMoods.length > 0 && (
        <div style={S.card}>
          <div style={S.cardTitle}>Mood</div>
          {topMoods.map(([label, count]) => (
            <div key={label} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
              <span style={{ fontSize: 13, color: "#4a5c4a", minWidth: 110 }}>{label}</span>
              <div style={{ flex: 1, height: 8, background: "#f0ebe2", borderRadius: 4, overflow: "hidden" }}><div style={{ height: "100%", background: "#c4a86a", borderRadius: 4, width: `${(count / maxCount) * 100}%` }} /></div>
              <span style={{ fontSize: 12, color: "#7a6e5a", minWidth: 20 }}>{count}x</span>
            </div>
          ))}
        </div>
      )}

      {/* Photo comparison */}
      {photosInRange.length > 0 && (
        <div style={S.card}>
          <div style={S.cardTitle}>📷 Photo Comparison</div>
          {photosInRange.length >= 2 ? (
            <div style={{ display: "flex", gap: 10 }}>
              <div style={{ flex: 1 }}>
                <img src={firstPhoto.data} alt="" style={{ width: "100%", borderRadius: 12, aspectRatio: "1", objectFit: "cover" }} />
                <div style={{ fontSize: 11, color: "#9a8e7a", textAlign: "center", marginTop: 4 }}>Start · {fmtDate(firstPhoto.date).month.slice(0, 3)} {fmtDate(firstPhoto.date).date}</div>
              </div>
              <div style={{ flex: 1 }}>
                <img src={lastPhoto.data} alt="" style={{ width: "100%", borderRadius: 12, aspectRatio: "1", objectFit: "cover" }} />
                <div style={{ fontSize: 11, color: "#9a8e7a", textAlign: "center", marginTop: 4 }}>End · {fmtDate(lastPhoto.date).month.slice(0, 3)} {fmtDate(lastPhoto.date).date}</div>
              </div>
            </div>
          ) : (
            <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
              <img src={firstPhoto.data} alt="" style={{ width: 90, height: 90, borderRadius: 12, objectFit: "cover", flexShrink: 0 }} />
              <div style={{ fontSize: 12, color: "#9a8e7a" }}>Only one photo this period — add more to see a before/after comparison.</div>
            </div>
          )}
        </div>
      )}

      {/* Treatments in range */}
      {treatmentsInRange.length > 0 && (
        <div style={S.card}>
          <div style={S.cardTitle}>💆 Treatments This Period</div>
          {treatmentsInRange.map(t => {
            const doneInRange = (t.history || []).filter(d => d >= rangeStart && d <= rangeEnd);
            return (
              <div key={t.id} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px solid #f5f0e8" }}>
                <span style={{ fontSize: 13, color: "#3a4a3a" }}>{t.name}</span>
                <span style={{ fontSize: 12, color: "#7a6e5a" }}>{doneInRange.length}x</span>
              </div>
            );
          })}
        </div>
      )}

      {/* Notes timeline */}
      <div style={S.card}>
        <div style={S.cardTitle}>📝 Observations Timeline</div>
        {notesEntries.length === 0 ? (
          <div style={S.emptySmall}>No saved notes for this period yet.</div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {notesEntries.map(e => (
              <div key={e.date} style={{ borderBottom: "1px solid #f5f0e8", paddingBottom: 8 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 2 }}>
                  <span style={{ fontSize: 12, fontWeight: "700", color: "#4a5c4a" }}>{fmtDate(e.date).month.slice(0, 3)} {fmtDate(e.date).date}</span>
                  <span style={{ fontSize: 11, color: "#9a8e7a" }}>{[e.condition, e.mood].filter(Boolean).join(" · ")}</span>
                </div>
                <div style={{ fontSize: 12, color: "#6a5e4e" }}>{e.notes}</div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ─── Modal Router ─────────────────────────────────────────────
function Modal({ modal, setModal, ingredients, setIngredients, productMeta, setProductMeta, renameFacialProduct, renameBodyProduct, renameHairProduct, renameStockItem, trials, addTrial, updateTrial, addTreatment, addHaircut, addPhoto, selDate, productData, setProductData, bodyProductData, setBodyProductData, hairProductData, setHairProductData }) {
  const close = () => setModal(null);
  if (modal.type === "productDetails") {
    const onRename = modal.fromStock
      ? (newName) => { renameStockItem(modal.scope, modal.product, newName); close(); }
      : modal.scope === "body"
      ? (newName) => { renameBodyProduct(modal.product, newName); close(); }
      : modal.scope === "hair"
      ? (newName) => { renameHairProduct(modal.product, newName); close(); }
      : (newName) => { renameFacialProduct(modal.period, modal.product, newName); close(); };
    return <ProductDetailsModal product={modal.product} ingredients={ingredients} setIngredients={setIngredients} productMeta={productMeta} setProductMeta={setProductMeta} onRename={onRename} close={close} />;
  }
  if (modal.type === "addTrial") return <AddTrialModal addTrial={addTrial} close={close} />;
  if (modal.type === "startTrial" || modal.type === "addObservation" || modal.type === "reflection") {
    const trial = (trials || []).find(t => t.id === modal.id);
    if (!trial) return null;
    if (modal.type === "startTrial") return <StartTrialModal trial={trial} updateTrial={updateTrial} close={close} />;
    if (modal.type === "addObservation") return <AddObservationModal trial={trial} updateTrial={updateTrial} close={close} />;
    return <ReflectionModal trial={trial} updateTrial={updateTrial} close={close} />;
  }
  if (modal.type === "addTreatment") return <AddTreatmentModal addTreatment={addTreatment} close={close} />;
  if (modal.type === "addHaircut") return <AddHaircutModal addHaircut={addHaircut} close={close} />;
  if (modal.type === "addPhoto") return <AddPhotoModal date={modal.date||selDate} addPhoto={addPhoto} close={close} preloaded={modal.preloaded} />;
  if (modal.type === "photoView") return <PhotoViewModal photo={modal.photo} date={modal.date} close={close} />;
  if (modal.type === "productTracker") return <ProductTrackerModal product={modal.product} productData={productData} setProductData={setProductData} close={close} />;
  if (modal.type === "restock") return <RestockModal product={modal.product} productData={productData} setProductData={setProductData} close={close} />;
  if (modal.type === "bodyProductTracker") return <ProductTrackerModal product={modal.product} productData={bodyProductData} setProductData={setBodyProductData} close={close} />;
  if (modal.type === "bodyRestock") return <RestockModal product={modal.product} productData={bodyProductData} setProductData={setBodyProductData} close={close} />;
  if (modal.type === "hairProductTracker") return <ProductTrackerModal product={modal.product} productData={hairProductData} setProductData={setHairProductData} close={close} />;
  if (modal.type === "hairRestock") return <RestockModal product={modal.product} productData={hairProductData} setProductData={setHairProductData} close={close} />;
  return null;
}

// ─── Product Tracker Modal ────────────────────────────────────
function ProductTrackerModal({ product, productData, setProductData, close }) {
  const pd = productData[product] || initProductData();
  const stockStatus = getStockStatus(pd);
  const today = todayStr();
  const daysPassed = pd.calibrationStart ? Math.max(0, Math.ceil((new Date(today+"T12:00:00") - new Date(pd.calibrationStart+"T12:00:00")) / 86400000)) : 0;
  const calPct = Math.min(100, Math.round((daysPassed / (pd.calibrationDays||30)) * 100));

  const handleMarkEmpty = () => {
    const updated = completeCalibration(pd, today);
    setProductData(prev => ({ ...prev, [product]: updated }));
    close();
  };

  const handleRestock = () => {
    const updated = restockProduct(pd, today);
    setProductData(prev => ({ ...prev, [product]: updated }));
    close();
  };

  const handleReset = () => {
    setProductData(prev => ({ ...prev, [product]: initProductData() }));
    close();
  };

  return (
    <Overlay close={close}>
      <div style={S.modalTitle}>📦 {product}</div>
      <div style={S.modalSub}>Product lifespan tracker</div>

      {pd.calibrating ? (
        <div style={S.trackerSection}>
          <div style={{ ...S.trackerBadge, background: "#c4a86a22", color: "#c4a86a" }}>🔬 Calibration Phase</div>
          <div style={S.trackerDesc}>The app is learning how long this product lasts for you over {pd.calibrationDays||30} days.</div>
          <div style={S.trackerRow}><span>Started</span><span>{fmtDate(pd.calibrationStart).month} {fmtDate(pd.calibrationStart).date}</span></div>
          <div style={S.trackerRow}><span>Day</span><span>{daysPassed} of {pd.calibrationDays||30}</span></div>
          <div style={S.trackerRow}><span>Uses logged</span><span>{pd.calibrationUses||0}</span></div>
          <div style={{ height:6, background:"#f0ebe2", borderRadius:4, overflow:"hidden", margin:"10px 0" }}>
            <div style={{ height:"100%", background:"#c4a86a", width:`${calPct}%`, borderRadius:4 }} />
          </div>
          <div style={S.trackerDesc}>Run out of product before 30 days? Tap below — the app will calculate your usage rate now.</div>
          <button style={{ ...S.primaryBtn, width:"100%", marginTop:8 }} onClick={handleMarkEmpty}>📭 Mark as empty — calculate now</button>
        </div>
      ) : (
        <div style={S.trackerSection}>
          <div style={{ ...S.trackerBadge, background:"#7a9e7e22", color:"#7a9e7e" }}>✅ Calibrated</div>
          <div style={S.trackerRow}><span>Learned duration</span><span style={{ fontWeight:"700" }}>~{pd.learnedDuration} days</span></div>
          <div style={S.trackerRow}><span>Uses per day</span><span>{(pd.learnedUsesPerDay||0).toFixed(2)}</span></div>
          {stockStatus ? (
            <>
              <div style={S.trackerRow}><span>Estimated empty</span><span style={{ color: stockStatus.daysLeft<=7?"#d4846a":"#4a5c4a" }}>{fmtDate(stockStatus.estimatedEmpty).month} {fmtDate(stockStatus.estimatedEmpty).date}</span></div>
              <div style={S.trackerRow}><span>Days remaining</span><span style={{ color: stockStatus.daysLeft<=7?"#d4846a":"#7a9e7e", fontWeight:"700" }}>~{Math.max(0, stockStatus.daysLeft)}d</span></div>
            </>
          ) : null}
          <div style={{ height:6, background:"#f0ebe2", borderRadius:4, overflow:"hidden", margin:"10px 0" }}>
            {stockStatus && pd.learnedDuration ? (
              <div style={{ height:"100%", background: stockStatus.daysLeft<=7?"#d4846a":"#7a9e7e", width:`${Math.max(0, Math.min(100, (stockStatus.daysLeft/pd.learnedDuration)*100))}%`, borderRadius:4 }} />
            ) : null}
          </div>
          <button style={{ ...S.addBtn, width:"100%", marginTop:8 }} onClick={handleRestock}>↺ Restock — reset countdown</button>
        </div>
      )}
      <div style={S.trackerHistory}>
        <div style={S.trackerHistLabel}>Total uses: {pd.history?.length||0} · Restocks: {(pd.stock?.length||1)-1}</div>
      </div>
      <div style={S.modalBtns}>
        <button style={S.cancelBtn} onClick={handleReset}>Reset tracker</button>
        <button style={S.primaryBtn} onClick={close}>Done</button>
      </div>
    </Overlay>
  );
}

function RestockModal({ product, productData, setProductData, close }) {
  const pd = productData[product] || initProductData();
  const handleRestock = () => {
    const updated = restockProduct(pd, todayStr());
    setProductData(prev => ({ ...prev, [product]: updated }));
    close();
  };
  return (
    <Overlay close={close}>
      <div style={S.modalTitle}>↺ Restock {product}</div>
      {pd.learnedDuration ? (
        <div style={S.trackerDesc}>Based on your usage, this product should last <strong>~{pd.learnedDuration} days</strong>. The countdown will start fresh from today.</div>
      ) : (
        <div style={S.trackerDesc}>No usage data yet — the calibration phase will restart.</div>
      )}
      <div style={S.modalBtns}>
        <button style={S.cancelBtn} onClick={close}>Cancel</button>
        <button style={S.primaryBtn} onClick={handleRestock}>Confirm Restock</button>
      </div>
    </Overlay>
  );
}

// ─── Ingredient Modal ─────────────────────────────────────────
// ─── Product Details Modal (name, ingredients, incompatibilities, price) ──
function ProductDetailsModal({ product, ingredients, setIngredients, productMeta, setProductMeta, onRename, close }) {
  const list = ingredients[product] || [];
  const [raw, setRaw] = useState(list.join(", "));
  const [newIngr, setNewIngr] = useState("");
  const meta = productMeta[product] || { incompatible: [], price: "" };
  const [incompRaw, setIncompRaw] = useState((meta.incompatible || []).join(", "));
  const [newIncomp, setNewIncomp] = useState("");
  const [price, setPrice] = useState(meta.price || "");
  const [brand, setBrand] = useState(meta.brand || "");
  const [notes, setNotes] = useState(meta.notes || "");
  const [nameInput, setNameInput] = useState(product);

  const ingrList = () => raw.split(",").map(s => s.trim()).filter(Boolean);
  const incompList = () => incompRaw.split(",").map(s => s.trim()).filter(Boolean);

  const addIngr = () => { if (!newIngr.trim()) return; setRaw([...ingrList(), newIngr.trim()].join(", ")); setNewIngr(""); };
  const addIncomp = () => { if (!newIncomp.trim()) return; setIncompRaw([...incompList(), newIncomp.trim()].join(", ")); setNewIncomp(""); };

  const save = () => {
    setIngredients(p => ({ ...p, [product]: ingrList() }));
    setProductMeta(p => ({ ...p, [product]: { ...(p[product] || {}), incompatible: incompList(), price: price.trim(), brand: brand.trim(), notes: notes.trim() } }));
    close();
  };

  const saveName = () => { if (nameInput.trim() && nameInput.trim() !== product) onRename(nameInput.trim()); };

  return (
    <Overlay close={close}>
      <div style={S.modalTitle}>🧪 Product Details</div>
      <div style={S.modalSub}>{product}</div>

      <div style={S.formGroup}>
        <label style={S.formLabel}>Product Name</label>
        <div style={{ display: "flex", gap: 6 }}>
          <input style={{ ...S.formInput, flex: 1 }} value={nameInput} onChange={e => setNameInput(e.target.value)} />
          <button style={{ ...S.addBtn, opacity: (!nameInput.trim() || nameInput.trim() === product) ? 0.5 : 1 }} onClick={saveName} disabled={!nameInput.trim() || nameInput.trim() === product}>Rename</button>
        </div>
      </div>

      <div style={S.formGroup}>
        <label style={S.formLabel}>Brand</label>
        <input style={S.formInput} placeholder="e.g. CeraVe" value={brand} onChange={e => setBrand(e.target.value)} />
      </div>

      <div style={S.formGroup}>
        <label style={{ ...S.formLabel, color: NOTE_COLOR }}>📌 Important Notes</label>
        <textarea style={{ ...S.textarea, height: 64, borderColor: NOTE_COLOR + "66" }} placeholder="e.g. Night only · patch test first · avoid eye area" value={notes} onChange={e => setNotes(e.target.value)} />
        <div style={{ fontSize: 11, color: "#9a8e7a", marginTop: 4 }}>Shown as a reminder in your daily checklist.</div>
      </div>

      <div style={S.formGroup}>
        <label style={S.formLabel}>Ingredients</label>
        <div style={S.ingrAddRow}>
          <input style={S.addInput} placeholder="e.g. Niacinamide..." value={newIngr} onChange={e => setNewIngr(e.target.value)} onKeyDown={e => e.key === "Enter" && addIngr()} />
          <button style={S.addBtn} onClick={addIngr}>+</button>
        </div>
        {ingrList().length > 0 && (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 8 }}>
            {ingrList().map((ingr, i) => (
              <span key={i} style={S.ingrTag} onClick={() => { const arr = ingrList(); arr.splice(i, 1); setRaw(arr.join(", ")); }}>{ingr} ×</span>
            ))}
          </div>
        )}
        <textarea style={{ ...S.textarea, height: 60 }} placeholder="Or paste full ingredient list..." value={raw} onChange={e => setRaw(e.target.value)} />
      </div>

      <div style={S.formGroup}>
        <label style={S.formLabel}>Not Compatible With</label>
        <div style={S.ingrAddRow}>
          <input style={S.addInput} placeholder="e.g. Vitamin C, Retinol..." value={newIncomp} onChange={e => setNewIncomp(e.target.value)} onKeyDown={e => e.key === "Enter" && addIncomp()} />
          <button style={S.addBtn} onClick={addIncomp}>+</button>
        </div>
        {incompList().length > 0 && (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
            {incompList().map((tag, i) => (
              <span key={i} style={S.incompTag} onClick={() => { const arr = incompList(); arr.splice(i, 1); setIncompRaw(arr.join(", ")); }}>{tag} ×</span>
            ))}
          </div>
        )}
      </div>

      <div style={S.formGroup}>
        <label style={S.formLabel}>Price</label>
        <input style={S.formInput} placeholder="e.g. R249.99" value={price} onChange={e => setPrice(e.target.value)} />
      </div>

      <div style={S.modalBtns}><button style={S.cancelBtn} onClick={close}>Cancel</button><button style={S.primaryBtn} onClick={save}>Save</button></div>
    </Overlay>
  );
}

function IngredientModal({ product, ingredients, setIngredients, close }) {
  const list = ingredients[product] || [];
  const [raw, setRaw] = useState(list.join(", "));
  const [newIngr, setNewIngr] = useState("");
  const save = () => { setIngredients(p => ({ ...p, [product]: raw.split(",").map(s=>s.trim()).filter(Boolean) })); close(); };
  const addSingle = () => {
    if (!newIngr.trim()) return;
    const cur = raw.trim() ? raw.split(",").map(s=>s.trim()).filter(Boolean) : [];
    setRaw([...cur, newIngr.trim()].join(", ")); setNewIngr("");
  };
  return (
    <Overlay close={close}>
      <div style={S.modalTitle}>🧪 {product}</div>
      <div style={S.modalSub}>Add active ingredients to track what's in your routine</div>
      <div style={S.ingrAddRow}>
        <input style={S.addInput} placeholder="e.g. Niacinamide..." value={newIngr} onChange={e=>setNewIngr(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addSingle()} />
        <button style={S.addBtn} onClick={addSingle}>+</button>
      </div>
      {raw.split(",").map(s=>s.trim()).filter(Boolean).length > 0 && (
        <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:12 }}>
          {raw.split(",").map(s=>s.trim()).filter(Boolean).map((ingr,i) => (
            <span key={i} style={S.ingrTag} onClick={() => { const arr=raw.split(",").map(s=>s.trim()).filter(Boolean); arr.splice(i,1); setRaw(arr.join(", ")); }}>{ingr} ×</span>
          ))}
        </div>
      )}
      <div style={{ fontSize:11, color:"#9a8e7a", marginBottom:4 }}>Or paste full ingredient list:</div>
      <textarea style={{ ...S.textarea, height:80 }} placeholder="Aqua, Glycerin, Niacinamide..." value={raw} onChange={e=>setRaw(e.target.value)} />
      <div style={S.modalBtns}><button style={S.cancelBtn} onClick={close}>Cancel</button><button style={S.primaryBtn} onClick={save}>Save</button></div>

}

function AddTreatmentModal({ addTreatment, close }) {
  const [form, setForm] = useState({ name:"", category:"Face", frequency:"Monthly", notes:"" });
  const set = (k,v) => setForm(p=>({...p,[k]:v}));
  return (
    <Overlay close={close}>
      <div style={S.modalTitle}>💆 New Treatment</div>
      <div style={S.formGroup}><label style={S.formLabel}>Treatment Name</label><input style={S.formInput} placeholder="e.g. Hydrafacial..." value={form.name} onChange={e=>set("name",e.target.value)} /></div>

function AddPhotoModal({ date, addPhoto, close, preloaded }) {
  const [img, setImg] = useState(preloaded||null);
  const [caption, setCaption] = useState(""); const [tag, setTag] = useState("Progress");
  const fileRef = useRef();
  const handleFile = (e) => { const file=e.target.files[0]; if(!file) return; const r=new FileReader(); r.onload=ev=>setImg(ev.target.result); r.readAsDataURL(file); };
  return (
    <Overlay close={close}>
      <div style={S.modalTitle}>📷 Add Photo</div>
      <div style={S.modalSub}>{fmtDate(date).month} {fmtDate(date).date}, {fmtDate(date).year}</div>
      {img ? (
        <div style={{ position:"relative", marginBottom:12 }}>
          <img src={img} alt="preview" style={{ width:"100%", borderRadius:12, maxHeight:220, objectFit:"cover" }} />
          <button style={{ position:"absolute", top:6, right:6, background:"rgba(0,0,0,0.5)", color:"#fff", border:"none", borderRadius:"50%", width:26, height:26, cursor:"pointer" }} onClick={() => setImg(null)}>×</button>
        </div>
      ) : (
        <div style={S.photoUploadZone} onClick={() => fileRef.current.click()}><div style={{ fontSize:32, marginBottom:6 }}>📷</div><div style={S.modalSub}>Tap to select a photo</div><input type="file" accept="image/*" style={{ display:"none" }} ref={fileRef} onChange={handleFile} /></div>

      <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:12 }}>{PHOTO_TAGS.map(t=><button key={t} style={{ ...S.filterChip, ...(tag===t?S.filterChipActive:{}) }} onClick={()=>setTag(t)}>{t}</button>)}</div>
      <input style={S.formInput} placeholder="Caption (optional)" value={caption} onChange={e=>setCaption(e.target.value)} />
      <div style={S.modalBtns}><button style={S.cancelBtn} onClick={close}>Cancel</button><button style={{ ...S.primaryBtn, opacity:img?1:0.5 }} onClick={() => { if(!img) return; addPhoto(date,{data:img,caption,tag}); close(); }} disabled={!img}>Save Photo</button></div>
    </Overlay>
  );
}

function PhotoViewModal({ photo, date, close }) {

// ─── Shared Components ────────────────────────────────────────
function RingProgress({ value }) {
  const r=22, circ=2*Math.PI*r;
  return (
    <svg width="58" height="58" viewBox="0 0 58 58">
      <circle cx="29" cy="29" r={r} fill="none" stroke="#e8e0d6" strokeWidth="5" />
      <circle cx="29" cy="29" r={r} fill="none" stroke="#7a9e7e" strokeWidth="5" strokeDasharray={circ} strokeDashoffset={circ*(1-value/100)} strokeLinecap="round" transform="rotate(-90 29 29)" style={{ transition:"stroke-dashoffset 0.5s" }} />
      <text x="29" y="34" textAnchor="middle" fontSize="13" fontWeight="700" fill="#4a5c4a" fontFamily="Georgia,serif">{value}%</text>
    </svg>
  );
}
function ProgressBar({ value, color }) {
  return <div style={{ height:4, background:"#f0ebe2", borderRadius:4, overflow:"hidden" }}><div style={{ height:"100%", borderRadius:4, background:color, width:`${value*100}%`, transition:"width 0.4s" }} /></div>;
}
function TagPicker({ tags, value, onChange, color }) {
  return <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>{tags.map(t=><button key={t} style={{ ...S.tag, ...(value===t?{ background:color, borderColor:color, color:"#fff" }:{}) }} onClick={()=>onChange(value===t?null:t)}>{t}</button>)}</div>;
}

// Mount the app inside a wrapper that handles safe areas
function AppWrapper() {
  return React.createElement('div', {className: 'app-wrap'},
    React.createElement('div', {className: 'scroll-content'},
      React.createElement(App)
    )
  );
}

// Wait for DOM, then mount
const container = document.getElementById('root');
const reactRoot = ReactDOM.createRoot(container);
reactRoot.render(React.createElement(App));

// Hide splash after load
setTimeout(() => {
  const splash = document.getElementById('splash');
  if (splash) {
    splash.classList.add('hide');
    setTimeout(() => splash.remove(), 700);
  }
}, 1600);
</script>

<script>
// Register service worker (sw.js) for offline support
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

// Prevent pull-to-refresh on mobile
document.addEventListener('touchmove', e => {
  if (e.target === document.body) e.preventDefault();
}, {passive: false});
</script>
